<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>City Generator — Fantasy Map Generator</title>
  <meta name="description"
    content="Standalone Voronoi city generator for Azgaar's Fantasy Map Generator. Renders a burg's local geography as an SVG town plan." />
  <meta name="robots" content="noindex" />

  <link rel="icon" type="image/png" href="/images/icons/favicon-32x32.png" sizes="32x32" />
  <link rel="icon" type="image/png" href="/images/icons/favicon-16x16.png" sizes="16x16" />

  <style>
    :root {
      --paper: #ccc5b8;
      --ink: #1a1917;
      --ink-soft: #67635c;
      --line: #67635c;
      --panel: rgb(204 197 184 / 94%);
    }

    html,
    body {
      margin: 0;
      height: 100%;
      background: var(--paper);
      color: var(--ink);
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    #city-generator-root {
      position: fixed;
      inset: 0;
    }

    .cg-canvas {
      position: absolute;
      inset: 0;
      overflow: hidden;
      cursor: grab;
      touch-action: none;
    }

    .cg-canvas:active {
      cursor: grabbing;
    }

    .cg-viewport-host {
      width: 100%;
      height: 100%;
    }

    .cg-panel {
      position: absolute;
      box-sizing: border-box;
      display: grid;
      gap: 8px;
      padding: 12px 14px;
      border: 3px solid var(--ink);
      border-radius: 8px;
      background: var(--panel);
      font-size: 13px;
      font-weight: 700;
    }

    .cg-panel h1 {
      margin: 0;
      font-size: 14px;
      font-weight: 700;
    }

    .cg-panel--options {
      top: 12px;
      left: 12px;
      width: 220px;
      max-height: calc(100vh - 24px);
      overflow-y: auto;
    }

    .cg-panel--process {
      left: 50%;
      bottom: 12px;
      width: min(680px, calc(100vw - 32px));
      transform: translateX(-50%);
      gap: 10px;
    }

    .cg-panel--inspector {
      top: 12px;
      right: 12px;
      width: min(340px, calc(100vw - 24px));
      max-height: calc(100vh - 24px);
      overflow: auto;
    }

    .cg-inspector-kind {
      font-size: 13px;
    }

    .cg-inspector-content {
      box-sizing: border-box;
      max-height: min(55vh, 460px);
      margin: 0;
      padding: 8px;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: rgb(255 255 255 / 35%);
      font: 11px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-weight: 500;
      white-space: pre-wrap;
    }

    .cg-pickable:hover {
      filter: brightness(1.2);
    }

    .cg-is-selected,
    .cg-is-selected * {
      filter: brightness(1.3) drop-shadow(0 0 3px #f1cf55);
      stroke: #f1cf55 !important;
      stroke-width: 2.5px !important;
    }

    .cg-subhead {
      margin: 2px 0 -2px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--ink-soft);
    }

    .cg-choices {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .cg-nav {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }

    .cg-panel button {
      padding: 7px 10px;
      border: 2px solid var(--ink);
      border-radius: 4px;
      background: var(--ink);
      color: var(--paper);
      font-weight: 650;
      cursor: pointer;
    }

    .cg-panel button:hover {
      background: #3b3936;
    }

    .cg-choices button.is-active {
      background: var(--paper);
      color: var(--ink);
    }

    .cg-field label {
      display: grid;
      gap: 4px;
      font-size: 12px;
      font-weight: 600;
    }

    .cg-field input {
      width: 100%;
      box-sizing: border-box;
      padding: 5px 7px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: rgb(255 255 255 / 55%);
      font-weight: 600;
    }

    .cg-generate {
      justify-self: stretch;
    }

    .cg-slider-row {
      display: grid;
      grid-template-columns: auto 1fr;
      align-items: center;
      gap: 6px 10px;
    }

    .cg-slider-row output {
      justify-self: end;
      font-size: 12px;
      font-weight: 600;
      color: var(--ink-soft);
    }

    .cg-slider-row input[type="range"] {
      grid-column: 1 / -1;
      width: 100%;
      accent-color: var(--ink);
    }

    .cg-check-row label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
    }

    .cg-check-row input {
      width: auto;
    }

    .cg-imported {
      gap: 6px;
      padding: 8px 10px;
      border: 2px solid var(--ink);
      border-radius: 6px;
      background: rgb(255 255 255 / 35%);
    }

    .cg-imported-body {
      display: grid;
      gap: 3px;
      margin: 2px 0 4px;
    }

    .cg-imported-row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font-size: 12px;
      font-weight: 600;
    }

    .cg-imported-row span {
      color: var(--ink-soft);
    }
  </style>
</head>

<body>
  <div id="city-generator-root"></div>
  <script type="module" src="./main.ts"></script>
</body>

</html>
