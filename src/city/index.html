<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>City Generator — Fantasy Map Generator</title>
  <meta name="description"
    content="Standalone Voronoi city generator for Azgaar's Fantasy Map Generator. Renders a burg's local geography as an SVG town plan." />
  <meta name="robots" content="noindex" />

  <link rel="icon" type="image/png" href="/images/icons/favicon-32x32.png" sizes="32x32" />
  <link rel="icon" type="image/png" href="/images/icons/favicon-16x16.png" sizes="16x16" />

  <style>
    :root {
      --paper: #ccc5b8;
      --ink: #1a1917;
      --ink-soft: #67635c;
      --panel: rgb(204 197 184 / 94%);
    }

    html,
    body {
      margin: 0;
      height: 100%;
      background: var(--paper);
      color: var(--ink);
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #city-generator-root {
      position: fixed;
      inset: 0;
    }

    /* Scaffold placeholder — replaced by the real UI shell in M1+. */
    .cg-placeholder {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      opacity: 0.7;
    }

    .cg-placeholder h1 {
      margin: 0 0 6px;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .cg-placeholder p {
      margin: 0;
      font-size: 13px;
      color: var(--ink-soft);
    }
  </style>
</head>

<body>
  <div id="city-generator-root"></div>
  <script type="module" src="./main.ts"></script>
</body>

</html>
