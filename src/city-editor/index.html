<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>City Editor — Fantasy Map Generator</title>
    <meta name="description" content="Manual Voronoi city editor for Fantasy Map Generator" />
    <meta name="robots" content="noindex" />
    <style>
      :root { --canvas:#d8d4c9; --ink:#1d2930; --muted:#637078; --panel:rgb(248 250 247 / 94%); --line:#aab4b2; --accent:#168c97; --accent-dark:#0d5761; --warm:#e9a23b; }
      * { box-sizing:border-box; }
      html, body { margin:0; width:100%; height:100%; overflow:hidden; color:var(--ink); background:var(--canvas); font:12px/1.4 ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
      button, input, select { font:inherit; } #city-editor-root { position:fixed; inset:0; }
      .ce-canvas { position:absolute; inset:0; background:radial-gradient(circle at 50% 45%,#e8e5da 0,#d4d2c8 66%,#c5c5bf 100%); }
      .ce-map,.ce-svg { width:100%; height:100%; display:block; touch-action:none; } .ce-map--drop-target { outline:3px dashed var(--warm); outline-offset:-12px; } .ce-map--select,.ce-map--select * { cursor:default !important; } .ce-map--brush,.ce-map--brush * { cursor:crosshair !important; } .ce-map--panning,.ce-map--panning * { cursor:grabbing !important; }
      .ce-ward-brush-preview { position:absolute; z-index:1; display:block; border:2px solid #0d5761; border-radius:50%; background:rgb(22 140 151 / 12%); box-shadow:0 0 0 1px rgb(255 255 255 / 72%),0 1px 5px rgb(13 87 97 / 36%); transform:translate(-50%,-50%); pointer-events:none; } .ce-ward-brush-preview[hidden] { display:none; }
      .ce-svg { background:transparent; } .ce-reference-image { opacity:.82; }
      .ce-face { stroke:none; cursor:pointer; fill:#e1dfd4; } .ce-face--sea,.ce-face--lake,.ce-face--openWater { fill:#91c8d3; } .ce-face--land.ce-face--ward-unassigned { fill:#e1dfd4; } .ce-face--land.ce-face--ward-market { fill:#edcf7a; } .ce-face--land.ce-face--ward-castle { fill:#bca7ce; } .ce-face--land.ce-face--ward-merchant { fill:#dfa184; } .ce-face--land.ce-face--ward-craftsmen { fill:#d1a46e; } .ce-face--land.ce-face--ward-harbor { fill:#e3b66d; } .ce-face--land.ce-face--ward-park { fill:#99c187; } .ce-face--land.ce-face--ward-empty { fill:#f2ead2; } .ce-face.ce-selected { fill:#f4cf68; }
      .ce-edge { fill:none; stroke:#738083; stroke-width:1; vector-effect:non-scaling-stroke; cursor:pointer; } .ce-edge:hover,.ce-edge.ce-selected { stroke:var(--warm); stroke-width:4; } .ce-feature { fill:none; stroke-linecap:round; stroke-linejoin:round; opacity:.9; cursor:pointer; } .ce-feature--wall { stroke-dasharray:2 2; } .ce-feature--plank { filter:drop-shadow(0 0 1px #332b22); } .ce-active-group,.ce-hover-group { filter:drop-shadow(0 0 5px #ffd75c); } .ce-hover-group,.ce-route-preview { opacity:1; } .ce-route-preview { filter:drop-shadow(0 0 4px #ffd75c); }
      .ce-vertex { fill:#fffdf4; stroke:#1d2930; stroke-width:2; vector-effect:non-scaling-stroke; cursor:grab; } .ce-vertex:hover,.ce-vertex.ce-selected,.ce-hover-vertex { fill:#f5b844; stroke-width:3; } .ce-route-vertex { fill:#ffd75c; stroke:#342a22; stroke-width:3; } .ce-route-target { fill:#fff5d8; opacity:.78; } .ce-selection-label { fill:#1d2930; font-family:system-ui,sans-serif; font-weight:700; } .ce-selection-face-label { fill:#31444a; }
      .ce-element { color:#263c42; } .ce-element-halo { fill:rgb(255 253 244 / 82%); stroke:#d0d6ce; stroke-width:1; } .ce-element-mark { stroke-linecap:round; stroke-linejoin:round; } .ce-element--harbor { color:#0e6f83; } .ce-element--citadel { color:#5f4b70; } .ce-element--temple { color:#79572c; } .ce-tree-crown { fill:#697d64; stroke:#394b40; stroke-width:1; } .ce-tree-trunk { fill:none; stroke:#514538; stroke-linecap:round; }
      .ce-panel { position:absolute; z-index:4; width:max-content; max-width:270px; min-width:150px; border:1px solid #9da8a7; border-radius:8px; background:var(--panel); box-shadow:0 10px 26px #23313628,0 1px 2px #23313625; overflow:hidden; backdrop-filter:blur(12px); } .ce-panel--dragging { z-index:8; box-shadow:0 18px 38px #23313640; }
      .ce-panel-titlebar { display:flex; align-items:center; justify-content:space-between; height:29px; padding:0 8px 0 10px; border-bottom:1px solid #cbd2d0; background:linear-gradient(#fff,#edf1ed); cursor:grab; user-select:none; } .ce-panel-titlebar:active { cursor:grabbing; } .ce-panel h1 { margin:0; color:#25383c; font-size:10px; font-weight:800; letter-spacing:.13em; text-transform:uppercase; } .ce-panel-titlebar span { color:#8b9796; font-size:15px; line-height:1; }
      .ce-panel-content { display:grid; gap:8px; padding:9px; } .ce-panel-content > span { color:var(--muted); font-size:11px; } .ce-toolbar { top:14px; left:14px; width:260px; } .ce-document { top:14px; left:288px; width:238px; } .ce-inspector { top:14px; right:14px; width:220px; } .ce-groups { left:14px; bottom:36px; width:224px; max-height:35vh; overflow:auto; }
      .ce-icon-row { display:flex; flex-wrap:wrap; gap:5px; } .ce-group-row { display:grid; grid-template-columns:auto minmax(0,1fr) auto auto; align-items:center; gap:5px; } .ce-group-row span { color:var(--muted); font-size:11px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      .ce-panel hr { width:100%; margin:0; border:0; border-top:1px solid #d6dddb; } button { min-height:28px; padding:4px 7px; border:1px solid #aab5b3; border-radius:5px; color:var(--ink); background:#fffefa; cursor:pointer; } button:hover,button.is-active { color:white; border-color:var(--accent-dark); background:var(--accent-dark); } button:disabled { opacity:.42; cursor:default; } .ce-icon-button { display:inline-grid; place-items:center; width:30px; min-width:30px; height:30px; min-height:30px; padding:0; color:#294248; font-size:18px; font-weight:600; line-height:1; } .ce-icon-button { width:30px; height:30px; } .ce-group-row .ce-icon-button { width:27px; min-width:27px; height:27px; min-height:27px; font-size:15px; }
      label { display:grid; grid-template-columns:auto minmax(0,1fr); align-items:center; gap:6px; color:#4d5d61; font-size:11px; } label.is-disabled { opacity:.5; } input,select { min-width:0; max-width:150px; padding:4px 5px; border:1px solid var(--line); border-radius:4px; color:var(--ink); background:#fffefa; } input[type="range"] { width:100%; min-width:74px; padding:0; accent-color:var(--accent); } .ce-size-choice { grid-template-columns:1fr; gap:3px; } .ce-size-choice select { max-width:none; } .ce-brush-size-control { display:grid; grid-template-columns:minmax(74px,1fr) auto; align-items:center; gap:5px; } .ce-brush-size-control span { color:var(--muted); font-size:10px; white-space:nowrap; } .ce-junction-gap-control { display:grid; gap:4px; min-width:0; } .ce-junction-gap-scale { display:grid; gap:2px; min-width:0; max-width:100%; overflow-x:auto; padding:1px 0 2px; } .ce-junction-gap-line { width:1px; height:7px; min-width:1px; border:2px solid #435257; border-top:0; } .ce-junction-gap-scale span { color:var(--muted); font-size:10px; white-space:nowrap; }
      .ce-status { position:absolute; z-index:3; right:14px; bottom:13px; padding:5px 8px; border:1px solid #b7c0be; border-radius:4px; color:#536268; background:var(--panel); font-size:11px; } .ce-scale-bar { position:absolute; z-index:3; right:14px; bottom:41px; display:grid; gap:3px; justify-items:end; padding:5px 8px; border-radius:4px; color:#435257; background:var(--panel); pointer-events:none; } .ce-scale-bar-line { height:7px; min-width:1px; max-width:180px; border:2px solid #435257; border-top:0; } .ce-scale-bar-label { font-size:10px; white-space:nowrap; }
      .ce-context-menu { position:fixed; z-index:12; display:grid; gap:4px; min-width:210px; padding:6px; border:1px solid #9da8a7; border-radius:6px; background:var(--panel); box-shadow:0 8px 20px #2331363d; } .ce-context-menu[hidden] { display:none; } .ce-context-menu span { padding:4px; color:var(--muted); } .ce-context-menu button { text-align:left; }
      @media (max-width:760px) { .ce-document { top:14px; left:8px; max-width:200px; } .ce-inspector { top:auto; bottom:38px; right:8px; width:190px; max-height:42vh; overflow:auto; } .ce-groups { display:none; } .ce-toolbar { top:8px; left:8px; width:200px; max-height:calc(100vh - 16px); overflow:auto; } }
    </style>
  </head>
  <body>
    <div id="city-editor-root"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
