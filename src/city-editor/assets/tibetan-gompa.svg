<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-24 -24 48 48" width="500" height="500">
  <style>
    .ce-gompa-shadow { fill: rgba(18, 22, 25, 0.35); }
    .ce-gompa-terrace { fill: #c7bea9; stroke: #423825; stroke-width: 0.6px; }
    .ce-gompa-white-wall { fill: #f0ebe1; stroke: #3a3224; stroke-width: 0.5px; }
    .ce-gompa-red-hall { fill: #943227; stroke: #4a140d; stroke-width: 0.5px; }
    .ce-gompa-gold-roof { fill: #dfa83d; stroke: #543f11; stroke-width: 0.4px; }
    .ce-gompa-cell { fill: #ded6c8; stroke: #42392b; stroke-width: 0.35px; }
    .ce-gompa-gold-finial { fill: #f5c842; stroke: #543f11; stroke-width: 0.3px; }
  </style>
  <g class="ce-landmark ce-landmark--tibetan-gompa">
    <!-- 影 -->
    <g class="ce-gompa-shadow" transform="translate(1.4 1.6)">
      <polygon points="-18,-16 18,-16 18,17 -18,17"></polygon>
      <rect x="-8" y="-12" width="16" height="15" rx="0.5"></rect>
    </g>
    <!-- 山腹段状テラス（下層〜上層基壇） -->
    <g class="ce-gompa-terrace">
      <!-- 下層テラス広場（中庭） -->
      <polygon points="-18,-16 18,-16 18,17 -18,17"></polygon>
      <rect x="-16.5" y="-14.5" width="33" height="30" rx="0.5" fill="#ded4bf"></rect>
    </g>
    <!-- 段状僧房群（台形白壁の居住区・外周を取り囲む無数の僧房） -->
    <g class="ce-gompa-cell">
      <!-- 西側僧房群 -->
      <rect x="-16" y="-14" width="6" height="5" rx="0.2"></rect>
      <rect x="-16" y="-8" width="6" height="5.5" rx="0.2"></rect>
      <rect x="-16" y="-1.5" width="6" height="5.5" rx="0.2"></rect>
      <rect x="-16" y="5" width="6" height="5.5" rx="0.2"></rect>
      <rect x="-16" y="11.5" width="6" height="4" rx="0.2"></rect>
      <!-- 東側僧房群 -->
      <rect x="10" y="-14" width="6" height="5" rx="0.2"></rect>
      <rect x="10" y="-8" width="6" height="5.5" rx="0.2"></rect>
      <rect x="10" y="-1.5" width="6" height="5.5" rx="0.2"></rect>
      <rect x="10" y="5" width="6" height="5.5" rx="0.2"></rect>
      <rect x="10" y="11.5" width="6" height="4" rx="0.2"></rect>
      <!-- 南側客舎群 -->
      <rect x="-9" y="11.5" width="8.5" height="4"></rect>
      <rect x="0.5" y="11.5" width="8.5" height="4"></rect>
    </g>
    <!-- マニ車の回廊（Prayer Wheel Corridor - 中庭の周回路） -->
    <g>
      <line x1="-9" y1="-13" x2="9" y2="-13" stroke="#8c2e22" stroke-width="0.8"></line>
      <line x1="-9" y1="9" x2="9" y2="9" stroke="#8c2e22" stroke-width="0.8"></line>
      <!-- 金色の小マニ車群の象徴線 -->
      <line x1="-8" y1="-13" x2="8" y2="-13" stroke="#f0c24a" stroke-width="0.4" stroke-dasharray="0.8 0.5"></line>
      <line x1="-8" y1="9" x2="8" y2="9" stroke="#f0c24a" stroke-width="0.4" stroke-dasharray="0.8 0.5"></line>
    </g>
    <!-- 大集会堂（デュカン / Dukhang）中央の巨大な赤壁・黄土色建築 -->
    <g transform="translate(0, -3)">
      <!-- 白漆喰台形下層基壇 -->
      <rect x="-9" y="-9" width="18" height="15" rx="0.4" class="ce-gompa-white-wall"></rect>
      <!-- 紅色大殿（赤壁の上層本殿） -->
      <rect x="-7.5" y="-7.5" width="15" height="12" rx="0.3" class="ce-gompa-red-hall"></rect>
      <!-- 金色平屋根テラス（Golden Roof Pavilion） -->
      <rect x="-5.5" y="-5.5" width="11" height="8" rx="0.3" class="ce-gompa-gold-roof"></rect>
      <!-- 頂部の法輪（ダルマチャクラ）と左右の2頭の鹿（Dharmachakra & Deer） -->
      <g transform="translate(0, -1.5)">
        <circle cx="0" cy="0" r="1.1" class="ce-gompa-gold-finial"></circle>
        <circle cx="0" cy="0" r="0.6" fill="#ffffff"></circle>
        <!-- 左右の黄金の鹿 -->
        <ellipse cx="-2.2" cy="0" rx="0.8" ry="0.5" class="ce-gompa-gold-finial"></ellipse>
        <ellipse cx="2.2" cy="0" rx="0.8" ry="0.5" class="ce-gompa-gold-finial"></ellipse>
      </g>
      <!-- 屋根四隅の勝利の旗竿（ギェンツェン筒型飾り） -->
      <circle cx="-5" cy="-5" r="0.5" class="ce-gompa-gold-finial"></circle>
      <circle cx="5" cy="-5" r="0.5" class="ce-gompa-gold-finial"></circle>
      <circle cx="-5" cy="2" r="0.5" class="ce-gompa-gold-finial"></circle>
      <circle cx="5" cy="2" r="0.5" class="ce-gompa-gold-finial"></circle>
    </g>
    <!-- タルチョ五色祈祷旗柱（中庭中央） -->
    <g transform="translate(0, 7)">
      <circle cx="0" cy="0" r="0.7" fill="#8f7b60" stroke="#3d3527" stroke-width="0.3"></circle>
      <line x1="-3" y1="7" x2="3" y2="7" stroke="#2196f3" stroke-width="0.25"></line>
      <line x1="-3" y1="7.4" x2="3" y2="7.4" stroke="#f44336" stroke-width="0.25"></line>
      <line x1="-3" y1="7.8" x2="3" y2="7.8" stroke="#ffeb3b" stroke-width="0.25"></line>
    </g>
  </g>
</svg>
