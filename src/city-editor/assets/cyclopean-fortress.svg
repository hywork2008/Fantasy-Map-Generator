<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-24 -24 48 48" width="500" height="500">
  <style>
    .ce-cyclop-shadow { fill: rgba(18, 22, 25, 0.4); }
    .ce-cyclop-rock { fill: #6e6557; stroke: #2b261f; stroke-width: 0.7px; stroke-linejoin: round; }
    .ce-cyclop-megalith { fill: #8a7f6e; stroke: #2b261f; stroke-width: 0.6px; stroke-linejoin: round; }
    .ce-cyclop-megalith-light { fill: #9e9381; stroke: #2b261f; stroke-width: 0.55px; }
    .ce-cyclop-court { fill: #c4b9a3; stroke: #2b261f; stroke-width: 0.45px; }
    .ce-cyclop-megaron { fill: #ab9c85; stroke: #2b261f; stroke-width: 0.55px; }
    .ce-cyclop-hearth { fill: #241e17; stroke: #120e0a; stroke-width: 0.35px; }
    .ce-cyclop-flame { fill: #ff5722; }
  </style>
  <g class="ce-landmark ce-landmark--cyclopean-fortress">
    <!-- 影 -->
    <g class="ce-cyclop-shadow" transform="translate(1.4 1.6)">
      <polygon points="-18,-17 17,-19 20,6 12,18 -14,17 -19,-3"></polygon>
    </g>
    <!-- サイクロピアン超巨石外郭壁（不規則な超巨大ブロック群） -->
    <g class="ce-cyclop-rock">
      <polygon points="-18,-17 17,-19 20,6 12,18 -14,17 -19,-3"></polygon>
    </g>
    <!-- 城内中庭（アクロポリス上層テラス） -->
    <g class="ce-cyclop-court">
      <polygon points="-13,-13 13,-14 15,3 8,13 -9,12 -14,-1"></polygon>
    </g>
    <!-- 巨石乱石積みの表現（城壁に噛み合わされた数十トン級の巨石群） -->
    <g class="ce-cyclop-megalith">
      <!-- 北壁ブロック群 -->
      <polygon points="-18,-17 -10,-18 -11,-13 -18,-13" class="ce-cyclop-megalith-light"></polygon>
      <polygon points="-10,-18 2,-18 1,-13 -11,-13"></polygon>
      <polygon points="2,-18 17,-19 13,-14 1,-13" class="ce-cyclop-megalith-light"></polygon>
      <!-- 東壁ブロック群 -->
      <polygon points="17,-19 20,-6 15,-4 13,-14"></polygon>
      <polygon points="20,-6 20,6 15,4 15,-4" class="ce-cyclop-megalith-light"></polygon>
      <polygon points="20,6 12,18 9,13 15,4"></polygon>
      <!-- 西壁ブロック群 -->
      <polygon points="-18,-17 -19,-3 -14,-1 -18,-13"></polygon>
      <polygon points="-19,-3 -14,17 -9,12 -14,-1" class="ce-cyclop-megalith-light"></polygon>
    </g>
    <!-- 1. 迫り出しアーチ巨石門（Lion Gate / 巨石持ち送り門と三角レリーフ石）南壁 -->
    <g transform="translate(0, 15)">
      <!-- 門柱巨石（巨大なモノリス立石 2基） -->
      <rect x="-4.5" y="-3" width="2.8" height="5" class="ce-cyclop-megalith"></rect>
      <rect x="1.7" y="-3" width="2.8" height="5" class="ce-cyclop-megalith"></rect>
      <!-- 巨石まぐさ石（Lintel - 巨大な長方形石梁） -->
      <rect x="-4.8" y="-3.5" width="9.6" height="1.8" rx="0.2" fill="#ab9f8d" stroke="#2b261f" stroke-width="0.5"></rect>
      <!-- 三角形迫り出し空間（レリーフ石板） -->
      <polygon points="-2,-3.5 2,-3.5 0,-6" fill="#756a59" stroke="#2b261f" stroke-width="0.4"></polygon>
      <circle cx="0" cy="-4.5" r="0.5" fill="#c4b8a5"></circle> <!-- 双獅子紋章 -->
      <!-- 門道トンネル通路 -->
      <rect x="-1.7" y="-2" width="3.4" height="4" fill="#17130e"></rect>
    </g>
    <!-- 2. 城内王殿（メガロン / Megaron - 中央炉床と前室を持つ長堂） -->
    <g transform="translate(-1, -3)">
      <!-- メガロン石壁 -->
      <rect x="-7.5" y="-6.5" width="15" height="13" rx="0.4" class="ce-cyclop-megaron"></rect>
      <!-- 前室（ポーチと2本の大円柱） -->
      <rect x="-7.5" y="3" width="15" height="3.5" fill="#9e8f78"></rect>
      <circle cx="-3" cy="4.8" r="0.8" fill="#ded5c3" stroke="#2b261f" stroke-width="0.3"></circle>
      <circle cx="3" cy="4.8" r="0.8" fill="#ded5c3" stroke="#2b261f" stroke-width="0.3"></circle>
      <!-- 主殿主室と円形中央炉床（Great Hearth & 4本支柱） -->
      <circle cx="0" cy="-1.5" r="2.2" class="ce-cyclop-hearth"></circle>
      <circle cx="0" cy="-1.5" r="1.4" class="ce-cyclop-flame"></circle>
      <circle cx="0" cy="-1.5" r="0.6" fill="#ffca28"></circle>
      <!-- 炉床を囲む4本の柱座 -->
      <circle cx="-2.5" cy="-4" r="0.6" fill="#ded5c3"></circle>
      <circle cx="2.5" cy="-4" r="0.6" fill="#ded5c3"></circle>
      <circle cx="-2.5" cy="1" r="0.6" fill="#ded5c3"></circle>
      <circle cx="2.5" cy="1" r="0.6" fill="#ded5c3"></circle>
    </g>
    <!-- 3. 城壁内回廊トンネル（Corbelled Gallery - 城壁内部をくり抜いた避難通路）東壁内 -->
    <line x1="16" y1="-8" x2="16" y2="4" stroke="#1c1712" stroke-width="1.4" stroke-linecap="round"></line>
  </g>
</svg>
