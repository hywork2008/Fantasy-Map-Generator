<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-14 -14 28 28" width="500" height="500">
  <style>
    .ce-kurgan-shadow { fill: rgba(18, 22, 25, 0.35); }
    .ce-kurgan-grass { fill: #6e7d47; stroke: #3b4523; stroke-width: 0.6px; }
    .ce-kurgan-ring { stroke: #546334; stroke-width: 0.5px; fill: none; }
    .ce-kurgan-peak { fill: #829454; }
    .ce-kurgan-stone { fill: #9e9684; stroke: #3d372c; stroke-width: 0.4px; stroke-linejoin: round; }
    .ce-kurgan-balbal { fill: #8c8270; stroke: #2b251b; stroke-width: 0.5px; }
    .ce-kurgan-balbal-face { fill: #baaFA0; }
    .ce-kurgan-horse-pit { fill: #5c4731; stroke: #332517; stroke-width: 0.45px; }
    .ce-kurgan-gold { fill: #d4a73b; stroke: #5e4714; stroke-width: 0.3px; }
  </style>
  <g class="ce-landmark ce-landmark--steppe-kurgan" transform="translate(0 0) rotate(0)">
    <!-- 落ち影 (Ground Shadow) -->
    <g class="ce-kurgan-shadow" transform="translate(1.1 1.3)">
      <circle cx="0" cy="0" r="10.5"></circle>
      <circle cx="8.5" cy="5" r="2.8"></circle>
      <rect x="-0.8" y="10" width="1.6" height="2"></rect>
    </g>

    <!-- 主墳丘：巨大な草のマウンド (Main Kurgan Tumulus Mound) 直径 20m -->
    <g class="ce-kurgan-grass">
      <circle cx="0" cy="0" r="10.5"></circle>
      <!-- 等高段差の陰影（北西ハイライト / 南東シェード） -->
      <circle cx="0" cy="0" r="8" fill="#75854c" stroke="#48542b" stroke-width="0.4"></circle>
      <circle cx="0" cy="0" r="5.5" fill="#7d8f52" stroke="#48542b" stroke-width="0.4"></circle>
      <!-- 頂部テラス平坦部 -->
      <circle cx="0" cy="0" r="3" class="ce-kurgan-peak"></circle>
      <circle cx="-0.5" cy="-0.5" r="1.8" fill="#8ea35c" opacity="0.6"></circle>
    </g>

    <!-- 裾野の環状配石列（Stone Circle Kerb / 24基の自然石） 半径 10.2m -->
    <g class="ce-kurgan-stone">
      <!-- 角度ごとに配置された不揃いな石 -->
      <polygon points="10,-0.4 10.7,-0.2 10.6,0.5 9.9,0.4"></polygon>
      <polygon points="9.5,3.2 10.2,3.5 9.9,4.2 9.3,3.9"></polygon>
      <polygon points="7.3,6.8 8,7.2 7.6,7.9 6.9,7.5"></polygon>
      <polygon points="3.7,9.3 4.3,9.8 3.8,10.4 3.2,9.9"></polygon>
      <polygon points="-0.4,10 0.4,10.1 0.3,10.8 -0.5,10.7"></polygon>
      <polygon points="-4.2,9.2 -3.6,9.6 -4.1,10.3 -4.7,9.8"></polygon>
      <polygon points="-7.5,6.8 -6.9,7.2 -7.5,7.8 -8,7.4"></polygon>
      <polygon points="-9.7,3.3 -9.1,3.5 -9.5,4.3 -10.1,4"></polygon>
      <polygon points="-10.4,-0.3 -9.7,-0.2 -9.8,0.5 -10.5,0.4"></polygon>
      <polygon points="-9.6,-3.6 -8.9,-3.4 -9.3,-2.7 -10,-2.9"></polygon>
      <polygon points="-7.6,-7 -7,-6.6 -7.5,-5.9 -8.1,-6.3"></polygon>
      <polygon points="-4,-9.4 -3.3,-9.1 -3.7,-8.4 -4.4,-8.7"></polygon>
      <polygon points="-0.3,-10.4 0.5,-10.3 0.4,-9.6 -0.4,-9.7"></polygon>
      <polygon points="3.6,-9.5 4.3,-9.3 4,-8.5 3.3,-8.8"></polygon>
      <polygon points="7.1,-7.2 7.8,-6.8 7.4,-6.1 6.7,-6.5"></polygon>
      <polygon points="9.3,-3.8 10,-3.5 9.7,-2.8 9,-3.1"></polygon>
    </g>

    <!-- 愛馬の殉葬坑 (Sacrificed Steed Burial Pit) 南東側 -->
    <g transform="translate(8.5, 5)">
      <!-- 円形小塚 -->
      <circle cx="0" cy="0" r="2.8" class="ce-kurgan-horse-pit"></circle>
      <circle cx="0" cy="0" r="2.4" fill="#6e553a" stroke="#332517" stroke-width="0.35"></circle>
      <!-- 馬の骨（白骨）と頭骨の象徴 -->
      <ellipse cx="-0.3" cy="0" rx="0.5" ry="1.2" fill="#d9d1c1" stroke="#3d372c" stroke-width="0.3"></ellipse>
      <ellipse cx="-0.3" cy="-1" rx="0.4" ry="0.6" fill="#eae4d8" stroke="#3d372c" stroke-width="0.3"></ellipse>
      <!-- 黄金の面繁頭・馬具（Scythian Animal-style Gold Plaques） -->
      <circle cx="0.4" cy="-0.8" r="0.25" class="ce-kurgan-gold"></circle>
      <circle cx="0.4" cy="0.4" r="0.25" class="ce-kurgan-gold"></circle>
      <circle cx="-1" cy="0" r="0.2" class="ce-kurgan-gold"></circle>
      <!-- 殉葬小塚の外周小石 -->
      <circle cx="2.6" cy="0" r="0.3" fill="#9e9684"></circle>
      <circle cx="1.8" cy="1.9" r="0.3" fill="#9e9684"></circle>
      <circle cx="-1.8" cy="1.9" r="0.3" fill="#9e9684"></circle>
    </g>

    <!-- 南側正面に直立する戦士の石人（バルバル / Balbal Stone Human Stele） -->
    <!-- 南向きに立つ戦士：頭部、髭、胸元で杯（盃）を掲げる両手、腰のサーベル -->
    <g transform="translate(0, 11)">
      <!-- 落ち影 -->
      <ellipse cx="0.3" cy="0.4" rx="0.9" ry="0.6" fill="rgba(18, 22, 25, 0.4)"></ellipse>
      <!-- 石人本体（直立する長方形石柱） -->
      <rect x="-0.7" y="-0.6" width="1.4" height="1.2" rx="0.4" class="ce-kurgan-balbal"></rect>
      <!-- 頭部と帽子（円錐形フェルト帽） -->
      <circle cx="0" cy="-0.1" r="0.45" class="ce-kurgan-balbal-face"></circle>
      <!-- 髭と目鼻の彫刻刻み -->
      <line x1="-0.15" y1="0.1" x2="0.15" y2="0.1" stroke="#2b251b" stroke-width="0.2"></line>
      <line x1="0" y1="-0.1" x2="0" y2="0.1" stroke="#2b251b" stroke-width="0.2"></line>
      <!-- 胸元で両手で捧げ持つ儀礼用の聖杯（Cup/Goblet） -->
      <circle cx="0" cy="0.35" r="0.2" fill="#d4a73b" stroke="#3d2c0b" stroke-width="0.2"></circle>
      <!-- 腰の湾刀（サーベル / Scabbard） -->
      <line x1="-0.6" y1="0.5" x2="0.6" y2="0.5" stroke="#2b251b" stroke-width="0.25"></line>
      <line x1="-0.5" y1="0.5" x2="-0.8" y2="1.1" stroke="#1f1a13" stroke-width="0.3" stroke-linecap="round"></line>
    </g>

    <!-- 頂部の祭壇石（アルター・スラブ） -->
    <g transform="translate(0, 0)">
      <rect x="-1" y="-0.7" width="2" height="1.4" rx="0.2" fill="#756c5c" stroke="#332c22" stroke-width="0.4"></rect>
      <line x1="-0.6" y1="0" x2="0.6" y2="0" stroke="#473f32" stroke-width="0.3"></line>
      <circle cx="0" cy="0" r="0.2" fill="#c49a37"></circle>
    </g>
  </g>
</svg>
