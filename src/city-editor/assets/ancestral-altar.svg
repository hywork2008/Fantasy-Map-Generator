<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-14 -14 28 28" width="420" height="420">
  <style>
    .ce-ancestor-shadow { fill: rgba(18, 22, 25, 0.35); }
    .ce-ancestor-podium { fill: #ab9d87; stroke: #383021; stroke-width: 0.5px; stroke-linejoin: round; }
    .ce-ancestor-shrine { fill: #8a6747; stroke: #3d2512; stroke-width: 0.45px; }
    .ce-ancestor-roof { fill: #523e2b; stroke: #261a0f; stroke-width: 0.4px; }
    .ce-ancestor-totem { fill: #ded5c3; stroke: #383021; stroke-width: 0.35px; }
    .ce-ancestor-flame { fill: #ff5722; }
    .ce-ancestor-gold { fill: #dfa83d; stroke: #543f11; stroke-width: 0.25px; }
  </style>
  <g class="ce-landmark ce-landmark--ancestral-altar">
    <!-- 影 -->
    <g class="ce-ancestor-shadow" transform="translate(1 1.2)">
      <rect x="-8" y="-8" width="16" height="16" rx="0.5"></rect>
    </g>
    <!-- 切石基壇（三段ステップ） -->
    <g class="ce-ancestor-podium">
      <rect x="-8" y="-8" width="16" height="16" rx="0.4"></rect>
      <rect x="-6.5" y="-6.5" width="13" height="13" fill="#baad95"></rect>
      <rect x="-5" y="-5" width="10" height="10" fill="#c9bfa8"></rect>
    </g>
    <!-- 祠堂社殿（中央の神聖な祖霊堂） -->
    <g transform="translate(0, -1)">
      <rect x="-3.8" y="-3.2" width="7.6" height="6.4" rx="0.3" class="ce-ancestor-shrine"></rect>
      <!-- 寄棟屋根 -->
      <polygon points="-4.2,-3.6 4.2,-3.6 2.5,-1.5 -2.5,-1.5" class="ce-ancestor-roof"></polygon>
      <polygon points="-4.2,3.6 4.2,3.6 2.5,1.5 -2.5,1.5" fill="#3d2d1e"></polygon>
      <polygon points="-4.2,-3.6 -4.2,3.6 -2.5,0" fill="#473625"></polygon>
      <polygon points="4.2,-3.6 4.2,3.6 2.5,0" fill="#302216"></polygon>
      <!-- 頂部棟木と黄金宝珠 -->
      <line x1="-2.5" y1="0" x2="2.5" y2="0" stroke="#f0ebe1" stroke-width="0.4"></line>
      <circle cx="0" cy="0" r="0.6" class="ce-ancestor-gold"></circle>
    </g>
    <!-- 祠堂前庭の供物台石と香炉・聖火皿 -->
    <g transform="translate(0, 4.5)">
      <!-- 供物台石（Altar Slab） -->
      <rect x="-3" y="-1" width="6" height="2" rx="0.2" fill="#7d7260" stroke="#383021" stroke-width="0.3"></rect>
      <!-- 中央香炉・火種 -->
      <circle cx="0" cy="0" r="0.6" fill="#241e16" stroke="#120e0a" stroke-width="0.2"></circle>
      <circle cx="0" cy="0" r="0.35" class="ce-ancestor-flame"></circle>
      <!-- 左右の供物器 -->
      <circle cx="-1.8" cy="0" r="0.35" class="ce-ancestor-gold"></circle>
      <circle cx="1.8" cy="0" r="0.35" class="ce-ancestor-gold"></circle>
    </g>
    <!-- 祖霊トーテム柱（背後の直立石碑 2基） -->
    <rect x="-4" y="-7.2" width="1" height="1" class="ce-ancestor-totem"></rect>
    <rect x="3" y="-7.2" width="1" height="1" class="ce-ancestor-totem"></rect>
  </g>
</svg>
