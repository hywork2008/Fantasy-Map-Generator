<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 40 40" width="500" height="500">
  <style>
    .ce-fire-shadow { fill: rgba(18, 22, 25, 0.35); }
    .ce-fire-podium { fill: #c7beab; stroke: #423827; stroke-width: 0.65px; stroke-linejoin: round; }
    .ce-fire-pavement { fill: #ded5c1; stroke: #423827; stroke-width: 0.45px; }
    .ce-fire-pier { fill: #8f826d; stroke: #383021; stroke-width: 0.5px; }
    .ce-fire-dome { fill: #bfa886; stroke: #383021; stroke-width: 0.6px; }
    .ce-fire-flame-outer { fill: #ff4d15; }
    .ce-fire-flame-inner { fill: #ffca28; }
    .ce-fire-brazier { fill: #382c20; stroke: #1a140d; stroke-width: 0.4px; }
    .ce-fire-cloister { fill: #cfc4ad; stroke: #423827; stroke-width: 0.4px; }
  </style>
  <g class="ce-landmark ce-landmark--fire-temple">
    <!-- 影 -->
    <g class="ce-fire-shadow" transform="translate(1.2 1.4)">
      <rect x="-15" y="-15" width="30" height="30" rx="0.8"></rect>
      <circle cx="0" cy="0" r="6.2"></circle>
    </g>
    <!-- 外郭切石ポディウム（聖域基壇） -->
    <g class="ce-fire-podium">
      <rect x="-15" y="-15" width="30" height="30" rx="0.6"></rect>
    </g>
    <!-- 周回参拝回廊（外周を巡る静寂な石畳廊下） -->
    <g class="ce-fire-cloister">
      <rect x="-13" y="-13" width="26" height="26" rx="0.4"></rect>
      <rect x="-9" y="-9" width="18" height="18" rx="0.3" class="ce-fire-pavement"></rect>
      <!-- 四方の開口アーチ路 -->
      <line x1="0" y1="-13" x2="0" y2="13" stroke="#b8ab92" stroke-width="2.5"></line>
      <line x1="-13" y1="0" x2="13" y2="0" stroke="#b8ab92" stroke-width="2.5"></line>
    </g>
    <!-- 聖火堂（チャハール・ターク / Chahar Taq）4本の巨大な石角柱と4連大アーチ -->
    <g>
      <!-- 4本の巨大なL字型・角型石柱（Piers） -->
      <rect x="-6.5" y="-6.5" width="3.2" height="3.2" class="ce-fire-pier"></rect>
      <rect x="3.3" y="-6.5" width="3.2" height="3.2" class="ce-fire-pier"></rect>
      <rect x="-6.5" y="3.3" width="3.2" height="3.2" class="ce-fire-pier"></rect>
      <rect x="3.3" y="3.3" width="3.2" height="3.2" class="ce-fire-pier"></rect>
      <!-- 中央ドーム（4本の柱に架かる半球ドーム） -->
      <circle cx="0" cy="0" r="5.6" class="ce-fire-dome"></circle>
      <path d="M -3.9 -3.9 A 5.6 5.6 0 0 1 3.9 -3.9 L 0 0 Z" fill="#d9c3a3"></path>
      <path d="M 3.9 3.9 A 5.6 5.6 0 0 1 -3.9 3.9 L 0 0 Z" fill="#a89172"></path>
      <circle cx="0" cy="0" r="5.6" fill="none" stroke="#383021" stroke-width="0.55"></circle>
      <!-- 頂部の排煙オクルス（聖火の煙を逃す丸穴） -->
      <circle cx="0" cy="0" r="2.2" fill="#292015" stroke="#120d08" stroke-width="0.4"></circle>
    </g>
    <!-- 聖火壇（アーダシュ・常緑の不滅の炎）排煙穴の中心で赤く輝く火 -->
    <g transform="translate(0, 0)">
      <!-- 青銅製三脚大火皿（アタシュダン） -->
      <circle cx="0" cy="0" r="1.5" class="ce-fire-brazier"></circle>
      <circle cx="0" cy="0" r="1.1" class="ce-fire-flame-outer"></circle>
      <circle cx="0" cy="0" r="0.6" class="ce-fire-flame-inner"></circle>
      <circle cx="0" cy="0" r="0.25" fill="#ffffff"></circle>
    </g>
    <!-- 四方の階段アプローチ -->
    <g>
      <rect x="-2.5" y="14.5" width="5" height="1" fill="#a3957f"></rect>
      <rect x="-2.5" y="-15.5" width="5" height="1" fill="#a3957f"></rect>
      <rect x="14.5" y="-2.5" width="1" height="5" fill="#a3957f"></rect>
      <rect x="-15.5" y="-2.5" width="1" height="5" fill="#a3957f"></rect>
    </g>
  </g>
</svg>
