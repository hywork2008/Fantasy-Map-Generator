<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-24 -12 48 24" width="560" height="280">
  <style>
    .ce-archery-shadow { fill: rgba(18, 22, 25, 0.3); }
    .ce-archery-lawn { fill: #526b3b; stroke: #263816; stroke-width: 0.45px; }
    .ce-archery-butt-mound { fill: #826e49; stroke: #3d311d; stroke-width: 0.5px; }
    .ce-archery-target-white { fill: #f0ece1; stroke: #261f14; stroke-width: 0.25px; }
    .ce-archery-target-red { fill: #d63820; stroke: #261f14; stroke-width: 0.2px; }
    .ce-archery-target-gold { fill: #ffeb3b; }
    .ce-archery-stand { fill: #ded5c1; stroke: #383021; stroke-width: 0.35px; }
    .ce-archery-pavilion { fill: #6e4e31; stroke: #2b1c0f; stroke-width: 0.4px; }
    .ce-archery-lane { stroke: rgba(255, 255, 255, 0.25); stroke-width: 0.35px; stroke-dasharray: 2 1.5; }
  </style>
  <g class="ce-landmark ce-landmark--archery-butts">
    <!-- 影 -->
    <g class="ce-archery-shadow" transform="translate(1 1.2)">
      <rect x="-21" y="-8" width="42" height="16" rx="0.5"></rect>
    </g>
    <!-- 長方形射撃訓練芝生コース（Archery Range） -->
    <g class="ce-archery-lawn">
      <rect x="-21" y="-8" width="42" height="16" rx="0.4"></rect>
    </g>
    <!-- 射撃レーンライン（2レーン） -->
    <line x1="-14" y1="-3" x2="14" y2="-3" class="ce-archery-lane"></line>
    <line x1="-14" y1="3" x2="14" y2="3" class="ce-archery-lane"></line>
    <!-- 1. 矢受け土手・防護堤（The Butts - 東端の盛り土） -->
    <g transform="translate(16, 0)">
      <rect x="-2.5" y="-7" width="5" height="14" rx="0.8" class="ce-archery-butt-mound"></rect>
      <!-- 的（Targets / 藁束・同心円標的 2基） -->
      <g transform="translate(-1.5, -3)">
        <circle cx="0" cy="0" r="1.3" class="ce-archery-target-white"></circle>
        <circle cx="0" cy="0" r="0.85" class="ce-archery-target-red"></circle>
        <circle cx="0" cy="0" r="0.4" class="ce-archery-target-gold"></circle>
      </g>
      <g transform="translate(-1.5, 3)">
        <circle cx="0" cy="0" r="1.3" class="ce-archery-target-white"></circle>
        <circle cx="0" cy="0" r="0.85" class="ce-archery-target-red"></circle>
        <circle cx="0" cy="0" r="0.4" class="ce-archery-target-gold"></circle>
      </g>
    </g>
    <!-- 2. 射手射撃線（Shooting Line & Stand - 西側立ち位置） -->
    <g transform="translate(-14, 0)">
      <rect x="-1" y="-6.5" width="2" height="13" class="ce-archery-stand"></rect>
      <line x1="0" y1="-6" x2="0" y2="6" stroke="#993d2b" stroke-width="0.3"></line>
      <!-- 矢筒（Quivers） -->
      <circle cx="0" cy="-3" r="0.4" fill="#4d351f"></circle>
      <circle cx="0" cy="3" r="0.4" fill="#4d351f"></circle>
    </g>
    <!-- 3. 弓兵ギルド・スコア記録小屋（Guild Pavilion - 最西端） -->
    <g transform="translate(-18.5, 0)">
      <rect x="-1.8" y="-5" width="3.6" height="10" rx="0.3" class="ce-archery-pavilion"></rect>
      <!-- 切妻屋根棟線 -->
      <line x1="0" y1="-5" x2="0" y2="5" stroke="#a8805b" stroke-width="0.45"></line>
      <!-- ギルド旗竿 -->
      <circle cx="-1.2" cy="0" r="0.35" fill="#dfa83d"></circle>
    </g>
  </g>
</svg>
