<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 24 24" width="400" height="400">
  <style>
    .ce-bonewash-shadow { fill: rgba(18, 22, 25, 0.35); }
    .ce-bonewash-pavement { fill: #c7beab; stroke: #3d3524; stroke-width: 0.5px; }
    .ce-bonewash-table { fill: #ded7c8; stroke: #3d3524; stroke-width: 0.45px; stroke-linejoin: round; }
    .ce-bonewash-groove { stroke: #544933; stroke-width: 0.3px; }
    .ce-bonewash-water { fill: #3f799e; stroke: #1f3d52; stroke-width: 0.3px; }
    .ce-bonewash-grate { stroke: #523e2b; stroke-width: 0.35px; }
  </style>
  <g class="ce-landmark ce-landmark--bone-washing-table">
    <!-- 影 -->
    <g class="ce-bonewash-shadow" transform="translate(1 1.2)">
      <rect x="-8" y="-7" width="16" height="14" rx="0.5"></rect>
      <rect x="-4.5" y="-3.5" width="9" height="7" rx="0.3"></rect>
    </g>
    <!-- 洗骨所石畳床面と排水溝 -->
    <g class="ce-bonewash-pavement">
      <rect x="-8" y="-7" width="16" height="14" rx="0.4"></rect>
      <!-- 周囲の排水溝（Drain Trench） -->
      <path d="M -7 -6 L 7 -6 L 7 6 L -7 6 Z" fill="none" stroke="#241e14" stroke-width="0.6"></path>
    </g>
    <!-- 1. 中央石造洗骨台（Slab Table - 溝付き大理石・切石作業台） -->
    <g transform="translate(0, 0)">
      <rect x="-4.5" y="-3.5" width="9" height="7" rx="0.3" class="ce-bonewash-table"></rect>
      <!-- 台上面の排水傾斜スリット溝 -->
      <line x1="-3.5" y1="0" x2="3.5" y2="0" class="ce-bonewash-groove"></line>
      <line x1="-2.5" y1="-2" x2="-2.5" y2="2" class="ce-bonewash-groove"></line>
      <line x1="0" y1="-2.5" x2="0" y2="2.5" class="ce-bonewash-groove"></line>
      <line x1="2.5" y1="-2" x2="2.5" y2="2" class="ce-bonewash-groove"></line>
    </g>
    <!-- 2. 洗浄用水槽（Basin & Cistern - 北側） -->
    <g transform="translate(0, -5.2)">
      <rect x="-3" y="-1.2" width="6" height="2.4" rx="0.2" fill="#8f8471" stroke="#3d3524" stroke-width="0.35"></rect>
      <rect x="-2.4" y="-0.8" width="4.8" height="1.6" class="ce-bonewash-water"></rect>
    </g>
    <!-- 3. 木格子乾燥棚（Drying Grate - 南側）骨を乾かすスノコ台 -->
    <g transform="translate(0, 4.8)">
      <rect x="-3.5" y="-1" width="7" height="2" rx="0.2" fill="#8a6747" stroke="#382412" stroke-width="0.3"></rect>
      <line x1="-2.5" y1="-1" x2="-2.5" y2="1" class="ce-bonewash-grate"></line>
      <line x1="-1" y1="-1" x2="-1" y2="1" class="ce-bonewash-grate"></line>
      <line x1="0.5" y1="-1" x2="0.5" y2="1" class="ce-bonewash-grate"></line>
      <line x1="2" y1="-1" x2="2" y2="1" class="ce-bonewash-grate"></line>
    </g>
  </g>
</svg>
