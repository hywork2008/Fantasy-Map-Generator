<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 40 40" width="500" height="500">
  <style>
    .ce-madrasa-shadow { fill: rgba(18, 22, 25, 0.32); }
    .ce-madrasa-wall { fill: #ded6c5; stroke: #3a3427; stroke-width: 0.65px; }
    .ce-madrasa-court { fill: #f0ebe1; stroke: #3a3427; stroke-width: 0.45px; }
    .ce-madrasa-iwan { fill: #487d7d; stroke: #214242; stroke-width: 0.45px; }
    .ce-madrasa-cell-dome { fill: #b89f7f; stroke: #453725; stroke-width: 0.35px; }
    .ce-madrasa-pool { fill: #3f7e9e; stroke: #1f475e; stroke-width: 0.4px; }
    .ce-madrasa-pishtaq { fill: #c49a5b; stroke: #4a3417; stroke-width: 0.5px; }
  </style>
  <g class="ce-landmark ce-landmark--madrasa">
    <!-- 影 -->
    <g class="ce-madrasa-shadow" transform="translate(1.2 1.4)">
      <rect x="-15" y="-15" width="30" height="30" rx="0.8"></rect>
      <rect x="-4" y="14" width="8" height="2.5"></rect>
    </g>
    <!-- 外郭厚壁 -->
    <g class="ce-madrasa-wall">
      <rect x="-15" y="-15" width="30" height="30" rx="0.6"></rect>
      <!-- 四隅の円形強化バットレス塔 -->
      <circle cx="-15" cy="-15" r="1.8"></circle>
      <circle cx="15" cy="-15" r="1.8"></circle>
      <circle cx="-15" cy="15" r="1.8"></circle>
      <circle cx="15" cy="15" r="1.8"></circle>
    </g>
    <!-- 中庭（サフン） -->
    <g class="ce-madrasa-court">
      <rect x="-9" y="-9" width="18" height="18" rx="0.4"></rect>
    </g>
    <!-- 中央の清めの水盤・プール（八角池） -->
    <g transform="translate(0, 0)">
      <polygon points="0,-3 2.1,-2.1 3,0 2.1,2.1 0,3 -2.1,2.1 -3,0 -2.1,-2.1" fill="#c9bea9" stroke="#3a3427" stroke-width="0.35"></polygon>
      <polygon points="0,-2.3 1.6,-1.6 2.3,0 1.6,1.6 0,2.3 -1.6,1.6 -2.3,0 -1.6,-1.6" class="ce-madrasa-pool"></polygon>
      <circle cx="0" cy="0" r="0.4" fill="#ffffff" opacity="0.8"></circle>
    </g>
    <!-- 四大イーワーン（4方向の大アーチ講堂） -->
    <!-- 北イーワーン（主講堂） -->
    <g transform="translate(0, -9)">
      <rect x="-3.5" y="-5.5" width="7" height="5.5" fill="#3b6969" stroke="#1f4242" stroke-width="0.4"></rect>
      <polygon points="-3.5,0 3.5,0 0,-4.5" class="ce-madrasa-iwan"></polygon>
      <line x1="0" y1="0" x2="0" y2="-4.5" stroke="#1f4242" stroke-width="0.3"></line>
    </g>
    <!-- 南イーワーン（正面ピシュタク門直結） -->
    <g transform="translate(0, 9)">
      <rect x="-3.5" y="0" width="7" height="5.5" fill="#3b6969" stroke="#1f4242" stroke-width="0.4"></rect>
      <polygon points="-3.5,0 3.5,0 0,4.5" class="ce-madrasa-iwan"></polygon>
    </g>
    <!-- 東イーワーン -->
    <g transform="translate(9, 0)">
      <rect x="0" y="-3.5" width="5.5" height="7" fill="#3b6969" stroke="#1f4242" stroke-width="0.4"></rect>
      <polygon points="0,-3.5 0,3.5 4.5,0" class="ce-madrasa-iwan"></polygon>
    </g>
    <!-- 西イーワーン -->
    <g transform="translate(-9, 0)">
      <rect x="-5.5" y="-3.5" width="5.5" height="7" fill="#3b6969" stroke="#1f4242" stroke-width="0.4"></rect>
      <polygon points="0,-3.5 0,3.5 -4.5,0" class="ce-madrasa-iwan"></polygon>
    </g>
    <!-- 学生の個室房（フジュラ）小ドーム屋根群（四隅の2層構造） -->
    <!-- 北西隅の個室ドーム群 -->
    <circle cx="-12" cy="-12" r="1.5" class="ce-madrasa-cell-dome"></circle>
    <circle cx="-12" cy="-7" r="1.3" class="ce-madrasa-cell-dome"></circle>
    <circle cx="-7" cy="-12" r="1.3" class="ce-madrasa-cell-dome"></circle>
    <!-- 北東隅の個室ドーム群 -->
    <circle cx="12" cy="-12" r="1.5" class="ce-madrasa-cell-dome"></circle>
    <circle cx="12" cy="-7" r="1.3" class="ce-madrasa-cell-dome"></circle>
    <circle cx="7" cy="-12" r="1.3" class="ce-madrasa-cell-dome"></circle>
    <!-- 南西隅の個室ドーム群 -->
    <circle cx="-12" cy="12" r="1.5" class="ce-madrasa-cell-dome"></circle>
    <circle cx="-12" cy="7" r="1.3" class="ce-madrasa-cell-dome"></circle>
    <circle cx="-7" cy="12" r="1.3" class="ce-madrasa-cell-dome"></circle>
    <!-- 南東隅の個室ドーム群 -->
    <circle cx="12" cy="12" r="1.5" class="ce-madrasa-cell-dome"></circle>
    <circle cx="12" cy="7" r="1.3" class="ce-madrasa-cell-dome"></circle>
    <circle cx="7" cy="12" r="1.3" class="ce-madrasa-cell-dome"></circle>
    <!-- 正面入口ピシュタク（壮麗なモザイク大門額） -->
    <g transform="translate(0, 15)">
      <rect x="-4.2" y="-0.5" width="8.4" height="2.5" rx="0.3" class="ce-madrasa-pishtaq"></rect>
      <rect x="-2" y="0.2" width="4" height="1.6" fill="#1b1712"></rect>
      <circle cx="-3.6" cy="1.2" r="0.4" fill="#dfa83d"></circle>
      <circle cx="3.6" cy="1.2" r="0.4" fill="#dfa83d"></circle>
    </g>
  </g>
</svg>
