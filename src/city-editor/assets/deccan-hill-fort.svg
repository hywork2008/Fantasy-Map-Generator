<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-24 -24 48 48" width="500" height="500">
  <style>
    .ce-deccan-shadow { fill: rgba(18, 22, 25, 0.4); }
    .ce-deccan-rock { fill: #8a7c68; stroke: #383024; stroke-width: 0.65px; }
    .ce-deccan-wall { fill: #ab9c85; stroke: #383024; stroke-width: 0.6px; stroke-linejoin: round; }
    .ce-deccan-bastion { fill: #9e8e75; stroke: #383024; stroke-width: 0.5px; }
    .ce-deccan-chhatri { fill: #dfa83d; stroke: #47340d; stroke-width: 0.35px; }
    .ce-deccan-baori-step { fill: #6e6350; stroke: #262117; stroke-width: 0.3px; }
    .ce-deccan-water { fill: #1c526b; stroke: #0d2836; stroke-width: 0.35px; }
    .ce-deccan-palace { fill: #c9bea7; stroke: #383024; stroke-width: 0.45px; }
  </style>
  <g class="ce-landmark ce-landmark--deccan-hill-fort">
    <!-- 影 -->
    <g class="ce-deccan-shadow" transform="translate(1.4 1.6)">
      <polygon points="-18,-16 16,-19 20,4 12,18 -12,18 -19,4"></polygon>
    </g>
    <!-- 険峻な玄武岩山台地（Rock Plateau） -->
    <g class="ce-deccan-rock">
      <polygon points="-18,-16 16,-19 20,4 12,18 -12,18 -19,4"></polygon>
    </g>
    <!-- 外郭多重巨石城壁と半円稜堡塔群（Bastions） -->
    <g class="ce-deccan-wall">
      <polygon points="-16,-14 14,-17 17,3 10,16 -10,16 -17,3"></polygon>
    </g>
    <!-- 半円形巨石稜堡群（丸塔） -->
    <g class="ce-deccan-bastion">
      <circle cx="-16" cy="-14" r="2.8"></circle>
      <circle cx="14" cy="-17" r="2.8"></circle>
      <circle cx="17" cy="3" r="2.8"></circle>
      <circle cx="10" cy="16" r="2.8"></circle>
      <circle cx="-10" cy="16" r="2.8"></circle>
      <circle cx="-17" cy="3" r="2.8"></circle>
      <circle cx="0" cy="-18" r="2.5"></circle>
      <!-- 丸塔頂部のチャトリ（小東屋ドーム） -->
      <circle cx="-16" cy="-14" r="1.1" class="ce-deccan-chhatri"></circle>
      <circle cx="14" cy="-17" r="1.1" class="ce-deccan-chhatri"></circle>
      <circle cx="17" cy="3" r="1.1" class="ce-deccan-chhatri"></circle>
      <circle cx="-17" cy="3" r="1.1" class="ce-deccan-chhatri"></circle>
    </g>
    <!-- 1. 象返し屈曲城門（Hathi Pol / 象の突撃を防ぐS字クランク二重門）南壁 -->
    <g transform="translate(0, 16)">
      <!-- 屈曲防壁と狭隘通路 -->
      <path d="M -4 0 L -4 -4 L 4 -4 L 4 2 L 0 2" fill="none" stroke="#383024" stroke-width="2"></path>
      <!-- 象返し鉄棘スパイクの象徴 -->
      <line x1="-3" y1="-2" x2="-3" y2="0" stroke="#120e0a" stroke-width="0.8"></line>
      <circle cx="-4" cy="-3" r="1.5" class="ce-deccan-bastion"></circle>
      <circle cx="4" cy="-1" r="1.5" class="ce-deccan-bastion"></circle>
    </g>
    <!-- 2. 城内階段井戸・岩盤貯水池（バーオリ / Baori / Stepwell）北東区画 -->
    <g transform="translate(8, -8)">
      <rect x="-4" y="-4" width="8" height="8" rx="0.3" fill="#524838" stroke="#262117" stroke-width="0.4"></rect>
      <!-- 階段テラス -->
      <rect x="-3.2" y="-3.2" width="6.4" height="6.4" class="ce-deccan-baori-step"></rect>
      <rect x="-2.4" y="-2.4" width="4.8" height="4.8" fill="#42392b"></rect>
      <!-- 深いエメラルドブルーの岩盤湧水池 -->
      <rect x="-1.6" y="-1.6" width="3.2" height="3.2" class="ce-deccan-water"></rect>
    </g>
    <!-- 3. 中央要塞宮殿（Mahal / Citadel Palace - アーチ中庭と多層ドーム） -->
    <g transform="translate(-4, -2)">
      <rect x="-6" y="-6" width="12" height="12" rx="0.4" class="ce-deccan-palace"></rect>
      <rect x="-4" y="-4" width="8" height="8" rx="0.2" fill="#ded5c1"></rect>
      <!-- 宮殿ドーム群 -->
      <circle cx="-2.5" cy="-2.5" r="1.4" class="ce-deccan-chhatri"></circle>
      <circle cx="2.5" cy="-2.5" r="1.4" class="ce-deccan-chhatri"></circle>
      <circle cx="-2.5" cy="2.5" r="1.4" class="ce-deccan-chhatri"></circle>
      <circle cx="2.5" cy="2.5" r="1.4" class="ce-deccan-chhatri"></circle>
      <!-- 中央小池 -->
      <circle cx="0" cy="0" r="0.8" class="ce-deccan-water"></circle>
    </g>
  </g>
</svg>
