<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-18 -18 36 36" width="500" height="500">
  <style>
    .ce-mausoleum-shadow { fill: rgba(18, 22, 25, 0.35); }
    .ce-mausoleum-base { fill: #c4beaf; stroke: #3a362c; stroke-width: 0.7px; stroke-linejoin: round; }
    .ce-mausoleum-drum { fill: #d8d3c5; stroke: #3a362c; stroke-width: 0.8px; }
    .ce-mausoleum-podium { fill: #b3ad9e; stroke: #3a362c; stroke-width: 0.6px; }
    .ce-mausoleum-mound { fill: #526338; stroke: #323d22; stroke-width: 0.6px; }
    .ce-mausoleum-mound-ring { fill: #44542d; stroke: #2d381c; stroke-width: 0.5px; }
    .ce-mausoleum-core { fill: #d8d3c5; stroke: #3a362c; stroke-width: 0.7px; }
    .ce-mausoleum-stairs { fill: #b8b2a3; stroke: #3a362c; stroke-width: 0.4px; }
    .ce-mausoleum-column { fill: #ece8db; stroke: #3a362c; stroke-width: 0.4px; }
    .ce-mausoleum-statue { fill: #b89b43; stroke: #4e3f16; stroke-width: 0.5px; }
    .ce-cypress { fill: #1f3d24; stroke: #0f2113; stroke-width: 0.4px; }
    .ce-cypress-shadow { fill: rgba(18, 22, 25, 0.4); }
  </style>
  <g class="ce-landmark ce-landmark--roman-mausoleum" transform="translate(0 0) rotate(0)">
    <!-- 落ち影 (Ground Shadow) -->
    <g class="ce-mausoleum-shadow" transform="translate(1.2 1.4)">
      <rect x="-13" y="-13" width="26" height="26" rx="1.5"></rect>
      <rect x="-4.5" y="13" width="9" height="3"></rect>
      <circle cx="0" cy="0" r="11.8"></circle>
    </g>

    <!-- 方形切石基壇 (Square Stone Podium) 26m x 26m -->
    <g class="ce-mausoleum-podium">
      <rect x="-13" y="-13" width="26" height="26" rx="1.2"></rect>
      <!-- 基壇四隅のコーナーピラスター -->
      <rect x="-13.6" y="-13.6" width="2.4" height="2.4" fill="#9e988a" stroke="#3a362c" stroke-width="0.5"></rect>
      <rect x="11.2" y="-13.6" width="2.4" height="2.4" fill="#9e988a" stroke="#3a362c" stroke-width="0.5"></rect>
      <rect x="-13.6" y="11.2" width="2.4" height="2.4" fill="#9e988a" stroke="#3a362c" stroke-width="0.5"></rect>
      <rect x="11.2" y="11.2" width="2.4" height="2.4" fill="#9e988a" stroke="#3a362c" stroke-width="0.5"></rect>
    </g>

    <!-- 南側正面の大階段 (Southern Approach Stairs) -->
    <g class="ce-mausoleum-stairs">
      <rect x="-5.2" y="13" width="10.4" height="0.8"></rect>
      <rect x="-5.2" y="13.8" width="10.4" height="0.8"></rect>
      <rect x="-5.2" y="14.6" width="10.4" height="0.8"></rect>
      <rect x="-5.2" y="15.4" width="10.4" height="0.8"></rect>
      <!-- 階段両脇の彫刻台座 -->
      <rect x="-6.2" y="13.2" width="1" height="2.8" fill="#9e988a" stroke="#3a362c" stroke-width="0.4"></rect>
      <rect x="5.2" y="13.2" width="1" height="2.8" fill="#9e988a" stroke="#3a362c" stroke-width="0.4"></rect>
    </g>

    <!-- 円筒形外壁ドラム (Cylindrical Stone Drum) 半径11.5m -->
    <g class="ce-mausoleum-drum">
      <circle cx="0" cy="0" r="11.6"></circle>
      <!-- 外壁のコーニスと装飾モールディング -->
      <circle cx="0" cy="0" r="11" fill="none" stroke="#a39d8e" stroke-width="0.6"></circle>
    </g>

    <!-- 円錐形盛り土マウンド（植栽テラス / Tumulus Mound） -->
    <g class="ce-mausoleum-mound">
      <circle cx="0" cy="0" r="10.4"></circle>
      <!-- 内側テラス段差 -->
      <circle cx="0" cy="0" r="7.5" class="ce-mausoleum-mound-ring"></circle>
    </g>

    <!-- マウンド上の環状イトスギ植栽 (Ring of Cypress Trees) -->
    <g>
      <!-- 影 -->
      <ellipse cx="-6" cy="-6" rx="1.2" ry="0.9" class="ce-cypress-shadow" transform="translate(0.5 0.6)"></ellipse>
      <ellipse cx="6" cy="-6" rx="1.2" ry="0.9" class="ce-cypress-shadow" transform="translate(0.5 0.6)"></ellipse>
      <ellipse cx="-8.5" cy="0" rx="1.2" ry="0.9" class="ce-cypress-shadow" transform="translate(0.5 0.6)"></ellipse>
      <ellipse cx="8.5" cy="0" rx="1.2" ry="0.9" class="ce-cypress-shadow" transform="translate(0.5 0.6)"></ellipse>
      <ellipse cx="-6" cy="6" rx="1.2" ry="0.9" class="ce-cypress-shadow" transform="translate(0.5 0.6)"></ellipse>
      <ellipse cx="6" cy="6" rx="1.2" ry="0.9" class="ce-cypress-shadow" transform="translate(0.5 0.6)"></ellipse>
      <ellipse cx="0" cy="-8.5" rx="1.2" ry="0.9" class="ce-cypress-shadow" transform="translate(0.5 0.6)"></ellipse>

      <!-- 樹木本体 (尖塔状イトスギ) -->
      <circle cx="-6" cy="-6" r="1.3" class="ce-cypress"></circle>
      <circle cx="6" cy="-6" r="1.3" class="ce-cypress"></circle>
      <circle cx="-8.5" cy="0" r="1.3" class="ce-cypress"></circle>
      <circle cx="8.5" cy="0" r="1.3" class="ce-cypress"></circle>
      <circle cx="-6" cy="6" r="1.3" class="ce-cypress"></circle>
      <circle cx="6" cy="6" r="1.3" class="ce-cypress"></circle>
      <circle cx="0" cy="-8.5" r="1.3" class="ce-cypress"></circle>

      <!-- 樹冠ハイライト -->
      <circle cx="-6.2" cy="-6.2" r="0.7" fill="#36633b"></circle>
      <circle cx="5.8" cy="-6.2" r="0.7" fill="#36633b"></circle>
      <circle cx="-8.7" cy="-0.2" r="0.7" fill="#36633b"></circle>
      <circle cx="8.3" cy="-0.2" r="0.7" fill="#36633b"></circle>
      <circle cx="-6.2" cy="5.8" r="0.7" fill="#36633b"></circle>
      <circle cx="5.8" cy="5.8" r="0.7" fill="#36633b"></circle>
      <circle cx="-0.2" cy="-8.7" r="0.7" fill="#36633b"></circle>
    </g>

    <!-- 中央円形コア塔 (Central Core Stone Tower) 直径9m -->
    <g class="ce-mausoleum-core">
      <circle cx="0" cy="0" r="4.6"></circle>
      <circle cx="0" cy="0" r="4.1" fill="#ebe6d8" stroke="#3a362c" stroke-width="0.5"></circle>
      <!-- 円錐石屋根スライス（陰影） -->
      <path d="M 0 0 L -3.6 -1.8 A 4.1 4.1 0 0 1 0 -4.1 Z" fill="#f5f2e9" stroke="none"></path>
      <path d="M 0 0 L 0 -4.1 A 4.1 4.1 0 0 1 3.6 -1.8 Z" fill="#e0dbcb" stroke="none"></path>
      <path d="M 0 0 L 3.6 -1.8 A 4.1 4.1 0 0 1 2.9 2.9 Z" fill="#c7c1b0" stroke="none"></path>
      <path d="M 0 0 L 2.9 2.9 A 4.1 4.1 0 0 1 -2.9 2.9 Z" fill="#adaba0" stroke="none"></path>
      <path d="M 0 0 L -2.9 2.9 A 4.1 4.1 0 0 1 -3.6 -1.8 Z" fill="#bfbcb1" stroke="none"></path>
      <!-- 放射状リッジライン -->
      <line x1="0" y1="0" x2="0" y2="-4.1" stroke="#3a362c" stroke-width="0.4"></line>
      <line x1="0" y1="0" x2="3.6" y2="-1.8" stroke="#3a362c" stroke-width="0.4"></line>
      <line x1="0" y1="0" x2="2.9" y2="2.9" stroke="#3a362c" stroke-width="0.4"></line>
      <line x1="0" y1="0" x2="-2.9" y2="2.9" stroke="#3a362c" stroke-width="0.4"></line>
      <line x1="0" y1="0" x2="-3.6" y2="-1.8" stroke="#3a362c" stroke-width="0.4"></line>
    </g>

    <!-- 頂部の皇帝ブロンズ巨像 (Colossal Bronze Statue at Peak) -->
    <g class="ce-mausoleum-statue">
      <rect x="-0.8" y="-0.8" width="1.6" height="1.6" fill="#6e581c" stroke="#362b0e" stroke-width="0.3"></rect>
      <circle cx="0" cy="0" r="0.75"></circle>
      <circle cx="-0.2" cy="-0.2" r="0.35" fill="#f1d06e"></circle>
    </g>

    <!-- 正面プロピュライア列柱ポーチ (Front Colonnade Entrance Porch) -->
    <g>
      <!-- ポーチ屋根 -->
      <polygon points="-4.2,11.5 4.2,11.5 4.8,13 -4.8,13" fill="#d8d3c5" stroke="#3a362c" stroke-width="0.5"></polygon>
      <!-- 4本の正面コリント式円柱 -->
      <circle cx="-3.6" cy="12.8" r="0.45" class="ce-mausoleum-column"></circle>
      <circle cx="-1.2" cy="12.8" r="0.45" class="ce-mausoleum-column"></circle>
      <circle cx="1.2" cy="12.8" r="0.45" class="ce-mausoleum-column"></circle>
      <circle cx="3.6" cy="12.8" r="0.45" class="ce-mausoleum-column"></circle>
      <!-- 玄室入口の暗がり -->
      <rect x="-1.4" y="11.2" width="2.8" height="0.5" fill="#1b1712"></rect>
    </g>
  </g>
</svg>
