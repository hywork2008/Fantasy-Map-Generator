<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-22 -22 44 44" width="500" height="500">
  <style>
    .ce-marae-shadow { fill: rgba(18, 22, 25, 0.35); }
    .ce-marae-lawn { fill: #486938; stroke: #233b18; stroke-width: 0.5px; }
    .ce-marae-ahu { fill: #4a443c; stroke: #211e1a; stroke-width: 0.6px; }
    .ce-marae-standing-stone { fill: #8a7e70; stroke: #211e1a; stroke-width: 0.35px; }
    .ce-marae-curb { fill: #706556; stroke: #211e1a; stroke-width: 0.4px; }
    .ce-marae-tiki { fill: #754b2b; stroke: #38210f; stroke-width: 0.3px; }
    .ce-marae-palm { fill: #2e592a; stroke: #122b10; stroke-width: 0.35px; }
  </style>
  <g class="ce-landmark ce-landmark--polynesian-marae">
    <!-- 影 -->
    <g class="ce-marae-shadow" transform="translate(1.2 1.4)">
      <rect x="-16" y="-16" width="32" height="32" rx="0.5"></rect>
      <rect x="-14" y="-14" width="28" height="5"></rect>
    </g>
    <!-- 聖域芝生広場（Courtyard / Tahua） -->
    <g class="ce-marae-lawn">
      <rect x="-16" y="-16" width="32" height="32" rx="0.4"></rect>
      <!-- 周囲の玄武岩・珊瑚石の低石垣囲い（Curb Wall） -->
      <rect x="-16" y="-16" width="32" height="32" fill="none" class="ce-marae-curb" stroke-width="1.2"></rect>
    </g>
    <!-- 1. アフ（Ahu - 北端に横たわる玄武岩切石の長大祭壇石壇） -->
    <g transform="translate(0, -12)">
      <rect x="-14" y="-2.5" width="28" height="5" rx="0.3" class="ce-marae-ahu"></rect>
      <!-- 直立背もたれ石群（先祖・首長・祭司の直立石座 9基） -->
      <g class="ce-marae-standing-stone">
        <rect x="-12" y="-1.8" width="1.6" height="0.8" rx="0.2"></rect>
        <rect x="-9" y="-1.8" width="1.6" height="0.8" rx="0.2"></rect>
        <rect x="-6" y="-1.8" width="1.6" height="0.8" rx="0.2"></rect>
        <rect x="-3" y="-1.8" width="1.6" height="0.8" rx="0.2"></rect>
        <rect x="-1" y="-2" width="2" height="1" rx="0.2" fill="#b0a494"></rect> <!-- 中央主石 -->
        <rect x="3" y="-1.8" width="1.6" height="0.8" rx="0.2"></rect>
        <rect x="6" y="-1.8" width="1.6" height="0.8" rx="0.2"></rect>
        <rect x="9" y="-1.8" width="1.6" height="0.8" rx="0.2"></rect>
        <rect x="12" y="-1.8" width="1.6" height="0.8" rx="0.2"></rect>
      </g>
      <!-- アフの前面の供物台石 -->
      <rect x="-4" y="2.8" width="8" height="1.2" fill="#63594e" stroke="#211e1a" stroke-width="0.3"></rect>
    </g>
    <!-- 2. 木彫り神像（ティキ / 木製彫刻トーテム柱 2基） -->
    <g>
      <circle cx="-6" cy="-5" r="0.7" class="ce-marae-tiki"></circle>
      <circle cx="6" cy="-5" r="0.7" class="ce-marae-tiki"></circle>
    </g>
    <!-- 3. 広場内の首長・祭司の背もたれ石（広場中央・南寄りに点在する直立石座） -->
    <g class="ce-marae-standing-stone">
      <rect x="-5" cy="5" width="1.4" height="0.7" rx="0.15"></rect>
      <rect x="3.6" cy="5" width="1.4" height="0.7" rx="0.15"></rect>
      <rect x="-1" cy="10" width="2" height="0.8" rx="0.15"></rect>
    </g>
    <!-- 4. 聖域のヤシの木・パンノキ（四隅のトロピカル樹木） -->
    <g class="ce-marae-palm">
      <circle cx="-13" cy="13" r="2.2"></circle>
      <circle cx="13" cy="13" r="2.2"></circle>
      <circle cx="-13" cy="-7" r="1.8"></circle>
      <circle cx="13" cy="-7" r="1.8"></circle>
    </g>
    <!-- 正面入口（南壁中央の切れ目と平石） -->
    <rect x="-2.5" y="15" width="5" height="1.8" fill="#8f8373"></rect>
  </g>
</svg>
