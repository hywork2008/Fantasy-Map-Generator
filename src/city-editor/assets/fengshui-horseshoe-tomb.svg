<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 24 24" width="500" height="500">
  <style>
    .ce-tomb-shadow { fill: rgba(18, 22, 25, 0.35); }
    .ce-tomb-hill { fill: #4a5c37; stroke: #2a381d; stroke-width: 0.6px; }
    .ce-tomb-arm { fill: #cfc8b8; stroke: #3d3527; stroke-width: 0.6px; stroke-linejoin: round; }
    .ce-tomb-dome { fill: #dfd8ca; stroke: #3d3527; stroke-width: 0.7px; }
    .ce-tomb-turtle { stroke: #3d3527; stroke-width: 0.35px; fill: #eae4d8; }
    .ce-tomb-court { fill: #d1c9b6; stroke: #3d3527; stroke-width: 0.5px; }
    .ce-tomb-stele { fill: #332d22; stroke: #1a1610; stroke-width: 0.4px; }
    .ce-tomb-incense { fill: #8a3324; stroke: #42140c; stroke-width: 0.35px; }
    .ce-pine { fill: #1e3d2b; stroke: #0d2115; stroke-width: 0.4px; }
    .ce-pine-shadow { fill: rgba(18, 22, 25, 0.35); }
  </style>
  <g class="ce-landmark ce-landmark--fengshui-tomb" transform="translate(0 0) rotate(0)">
    <!-- 落ち影 (Ground Shadow) -->
    <g class="ce-tomb-shadow" transform="translate(0.9 1.1)">
      <path d="M -8 -8 C -8 -11, 8 -11, 8 -8 C 9 -4, 9 2, 7 8 L -7 8 C -9 2, -9 -4, -8 -8 Z"></path>
    </g>

    <!-- 背後の風水丘陵・斜面芝生 (Back Hill Slope / Xuanwu) -->
    <g class="ce-tomb-hill">
      <path d="M -11 -6 C -11 -11, 11 -11, 11 -6 C 11 -2, 10 3, 9 7 L -9 7 C -10 3, -11 -2, -11 -6 Z"></path>
    </g>

    <!-- 左右の守護松（青龍松・白虎松） -->
    <g>
      <ellipse cx="-9" cy="-5" rx="1.5" ry="1.2" class="ce-pine-shadow" transform="translate(0.5 0.6)"></ellipse>
      <ellipse cx="9" cy="-5" rx="1.5" ry="1.2" class="ce-pine-shadow" transform="translate(0.5 0.6)"></ellipse>
      <!-- 左の松（青龍） -->
      <circle cx="-9" cy="-5" r="1.8" class="ce-pine"></circle>
      <circle cx="-9.3" cy="-5.2" r="1" fill="#305e43"></circle>
      <!-- 右の松（白虎） -->
      <circle cx="9" cy="-5" r="1.8" class="ce-pine"></circle>
      <circle cx="8.7" cy="-5.2" r="1" fill="#305e43"></circle>
    </g>

    <!-- 馬蹄形擁壁（青龍砂・白虎砂の囲い壁 / Horseshoe Enclosure Wall） -->
    <g class="ce-tomb-arm">
      <!-- 外壁の帯（幅0.9mの厚い漆喰石壁） -->
      <path d="M -7 7 C -8.5 2, -8.5 -5, -6 -8 C -4 -10, 4 -10, 6 -8 C 8.5 -5, 8.5 2, 7 7 L 5.8 7 C 7.2 2, 7.2 -4, 5.2 -6.8 C 3.5 -8.6, -3.5 -8.6, -5.2 -6.8 C -7.2 -4, -7.2 2, -5.8 7 Z"></path>
      <!-- 壁の先端の丸い巻き込み装飾 -->
      <circle cx="-6.4" cy="7" r="0.6"></circle>
      <circle cx="6.4" cy="7" r="0.6"></circle>
    </g>

    <!-- 内側第二の擁壁（母胎を象徴する子宮壁） -->
    <g class="ce-tomb-arm">
      <path d="M -4.8 1.5 C -5.8 -1.5, -5.8 -4.5, -4 -6 C -2.8 -7.2, 2.8 -7.2, 4 -6 C 5.8 -4.5, 5.8 -1.5, 4.8 1.5 L 3.8 1.5 C 4.6 -1, 4.6 -3.8, 3.2 -5 C 2.2 -5.8, -2.2 -5.8, -3.2 -5 C -4.6 -3.8, -4.6 -1, -3.8 1.5 Z"></path>
    </g>

    <!-- 中央の亀甲状ドーム屋根（玄室 / Turtle-back Mound） 7m x 6m -->
    <g class="ce-tomb-dome">
      <path d="M -3.5 -1 C -3.5 -5, 3.5 -5, 3.5 -1 C 3.5 0.5, 2.5 1.5, 0 1.5 C -2.5 1.5, -3.5 0.5, -3.5 -1 Z"></path>
    </g>

    <!-- 亀甲の幾何学模様（六角形甲羅のレリーフ） -->
    <g class="ce-tomb-turtle">
      <!-- 中央六角形 -->
      <polygon points="0,-3.2 0.9,-2.7 0.9,-1.7 0,-1.2 -0.9,-1.7 -0.9,-2.7"></polygon>
      <!-- 上部六角形 -->
      <polygon points="0,-4.5 0.8,-4.1 0.8,-3.4 0,-3.2 -0.8,-3.4 -0.8,-4.1"></polygon>
      <!-- 左右六角形 -->
      <polygon points="1.8,-3.2 2.6,-2.7 2.6,-1.7 1.8,-1.2 0.9,-1.7 0.9,-2.7"></polygon>
      <polygon points="-1.8,-3.2 -0.9,-2.7 -0.9,-1.7 -1.8,-1.2 -2.6,-1.7 -2.6,-2.7"></polygon>
    </g>

    <!-- 玄室正面の墓標石碑（Stele / 神主牌） -->
    <g class="ce-tomb-stele">
      <rect x="-1.4" y="1.2" width="2.8" height="0.8" rx="0.15"></rect>
      <!-- 赤い金石文字の線（祖先碑文） -->
      <line x1="-0.8" y1="1.6" x2="0.8" y2="1.6" stroke="#b82e1f" stroke-width="0.3"></line>
    </g>

    <!-- 供物台（石壇） -->
    <rect x="-1.8" y="2.2" width="3.6" height="0.9" fill="#c4bcab" stroke="#3d3527" stroke-width="0.4" rx="0.1"></rect>

    <!-- 石造三脚香炉（Incense Burner） -->
    <g class="ce-tomb-incense">
      <circle cx="0" cy="3.6" r="0.45"></circle>
      <circle cx="0" cy="3.6" r="0.2" fill="#ff7043"></circle>
    </g>

    <!-- 正面広場（祭祀・ピクニック前庭 / トゥー / Courtyard） 12m x 5m -->
    <g class="ce-tomb-court">
      <path d="M -5.8 2.2 L -5.8 7.5 L 5.8 7.5 L 5.8 2.2 L 3.8 2.2 L 3.8 3.5 L -3.8 3.5 L -3.8 2.2 Z"></path>
      <!-- 石畳の敷石目地ライン -->
      <line x1="-5" y1="4.5" x2="5" y2="4.5" stroke="#bab09c" stroke-width="0.3"></line>
      <line x1="-5" y1="6" x2="5" y2="6" stroke="#bab09c" stroke-width="0.3"></line>
      <line x1="-2" y1="3.5" x2="-2" y2="7.5" stroke="#bab09c" stroke-width="0.3"></line>
      <line x1="2" y1="3.5" x2="2" y2="7.5" stroke="#bab09c" stroke-width="0.3"></line>
    </g>

    <!-- 前庭の左右の石灯籠（Stone Lanterns） -->
    <g>
      <rect x="-4.5" y="6" width="0.8" height="0.8" fill="#e8e2d5" stroke="#3d3527" stroke-width="0.35" rx="0.1"></rect>
      <circle cx="-4.1" cy="6.4" r="0.2" fill="#ffb74d"></circle>
      <rect x="3.7" y="6" width="0.8" height="0.8" fill="#e8e2d5" stroke="#3d3527" stroke-width="0.35" rx="0.1"></rect>
      <circle cx="4.1" cy="6.4" r="0.2" fill="#ffb74d"></circle>
    </g>
  </g>
</svg>
