<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 40 40" width="500" height="500">
  <style>
    .ce-khanaqah-shadow { fill: rgba(18, 22, 25, 0.32); }
    .ce-khanaqah-wall { fill: #ded5c3; stroke: #3d3527; stroke-width: 0.65px; }
    .ce-khanaqah-court { fill: #eae1cd; stroke: #3d3527; stroke-width: 0.45px; }
    .ce-khanaqah-dome-tomb { fill: #2e7a7a; stroke: #184242; stroke-width: 0.6px; }
    .ce-khanaqah-dome-hall { fill: #448f8f; stroke: #184242; stroke-width: 0.5px; }
    .ce-khanaqah-cell { fill: #bfa584; stroke: #423522; stroke-width: 0.35px; }
    .ce-khanaqah-tree { fill: #204523; stroke: #0f2411; stroke-width: 0.4px; }
    .ce-khanaqah-pool { fill: #3f799e; stroke: #1f4259; stroke-width: 0.35px; }
    .ce-khanaqah-gold { fill: #dfa83d; stroke: #543f11; stroke-width: 0.3px; }
  </style>
  <g class="ce-landmark ce-landmark--khanaqah">
    <!-- 影 -->
    <g class="ce-khanaqah-shadow" transform="translate(1.2 1.4)">
      <rect x="-15" y="-15" width="30" height="30" rx="0.8"></rect>
      <circle cx="-7.5" cy="-7.5" r="5.5"></circle>
      <circle cx="7.5" cy="-7.5" r="4.5"></circle>
    </g>
    <!-- 外郭壁・複合敷地基壇 -->
    <g class="ce-khanaqah-wall">
      <rect x="-15" y="-15" width="30" height="30" rx="0.6"></rect>
    </g>
    <!-- 中庭（庭園・オアシス） -->
    <g class="ce-khanaqah-court">
      <rect x="-13" y="-13" width="26" height="26" rx="0.4"></rect>
    </g>
    <!-- 聖者廟（クッバ - 北西側）：八角形ドラムと大ドーム -->
    <g transform="translate(-7.5, -7.5)">
      <!-- 廟ポディウム -->
      <polygon points="0,-6.5 4.6,-4.6 6.5,0 4.6,4.6 0,6.5 -4.6,4.6 -6.5,0 -4.6,-4.6" fill="#c4b89f" stroke="#3d3527" stroke-width="0.5"></polygon>
      <!-- 八角形壁 -->
      <polygon points="0,-5.8 4.1,-4.1 5.8,0 4.1,4.1 0,5.8 -4.1,4.1 -5.8,0 -4.1,-4.1" fill="#ded5c3" stroke="#3d3527" stroke-width="0.5"></polygon>
      <!-- ターコイズブルーの美しい大ドーム -->
      <circle cx="0" cy="0" r="5.2" class="ce-khanaqah-dome-tomb"></circle>
      <!-- ドームハイライトと陰影 -->
      <path d="M -3.6 -3.6 A 5.2 5.2 0 0 1 3.6 -3.6 L 0 0 Z" fill="#4ea1a1"></path>
      <path d="M 3.6 3.6 A 5.2 5.2 0 0 1 -3.6 3.6 L 0 0 Z" fill="#1b4747"></path>
      <circle cx="0" cy="0" r="5.2" fill="none" stroke="#184242" stroke-width="0.55"></circle>
      <!-- 頂部黄金アレム -->
      <circle cx="0" cy="0" r="0.8" class="ce-khanaqah-gold"></circle>
      <!-- 内部の聖者石棺（木枠格子の象徴） -->
      <rect x="-1.2" y="-0.6" width="2.4" height="1.2" fill="#2d6e35" stroke="#19421e" stroke-width="0.25"></rect>
    </g>
    <!-- 集会所・旋回舞踊堂（サマーハーナ - 北東側）四角形大堂と円形ドーム -->
    <g transform="translate(7.5, -7.5)">
      <rect x="-5" y="-5" width="10" height="10" rx="0.4" fill="#c9bea7" stroke="#3d3527" stroke-width="0.5"></rect>
      <circle cx="0" cy="0" r="4.2" class="ce-khanaqah-dome-hall"></circle>
      <path d="M -3 -3 A 4.2 4.2 0 0 1 3 -3 L 0 0 Z" fill="#5fb5b5"></path>
      <circle cx="0" cy="0" r="0.6" class="ce-khanaqah-gold"></circle>
    </g>
    <!-- 巡礼者宿房・修道僧の房室列（南側・西側・東側） -->
    <g>
      <!-- 南側客房列（小さな切妻・小ドーム屋根群） -->
      <rect x="-13" y="8" width="26" height="5" fill="#cfc2ab" stroke="#3d3527" stroke-width="0.4"></rect>
      <circle cx="-10" cy="10.5" r="1.4" class="ce-khanaqah-cell"></circle>
      <circle cx="-5" cy="10.5" r="1.4" class="ce-khanaqah-cell"></circle>
      <circle cx="0" cy="10.5" r="1.4" class="ce-khanaqah-cell"></circle>
      <circle cx="5" cy="10.5" r="1.4" class="ce-khanaqah-cell"></circle>
      <circle cx="10" cy="10.5" r="1.4" class="ce-khanaqah-cell"></circle>
      <!-- 西側客房列 -->
      <rect x="-13" y="-1" width="4.5" height="9" fill="#cfc2ab" stroke="#3d3527" stroke-width="0.4"></rect>
      <circle cx="-10.7" cy="1.5" r="1.3" class="ce-khanaqah-cell"></circle>
      <circle cx="-10.7" cy="5.5" r="1.3" class="ce-khanaqah-cell"></circle>
      <!-- 東側客房列 -->
      <rect x="8.5" y="-1" width="4.5" height="9" fill="#cfc2ab" stroke="#3d3527" stroke-width="0.4"></rect>
      <circle cx="10.7" cy="1.5" r="1.3" class="ce-khanaqah-cell"></circle>
      <circle cx="10.7" cy="5.5" r="1.3" class="ce-khanaqah-cell"></circle>
    </g>
    <!-- 中庭の清めの泉池（長方形水路・チャハルバーグ風） -->
    <g transform="translate(0, 2)">
      <rect x="-3" y="-2" width="6" height="4" rx="0.3" class="ce-khanaqah-pool"></rect>
      <line x1="0" y1="-2" x2="0" y2="2" stroke="#ffffff" stroke-width="0.3" opacity="0.7"></line>
    </g>
    <!-- 植栽（イトスギとナツメヤシ） -->
    <g>
      <ellipse cx="-4.5" cy="2" rx="0.7" ry="1.2" class="ce-khanaqah-tree"></ellipse>
      <ellipse cx="4.5" cy="2" rx="0.7" ry="1.2" class="ce-khanaqah-tree"></ellipse>
      <circle cx="-4" cy="-1" r="0.9" class="ce-khanaqah-tree"></circle>
      <circle cx="4" cy="-1" r="0.9" class="ce-khanaqah-tree"></circle>
    </g>
    <!-- 正面入口門（南壁中央） -->
    <rect x="-2.5" y="12.5" width="5" height="2" fill="#a89578" stroke="#3d3527" stroke-width="0.4"></rect>
    <rect x="-1.2" y="13" width="2.4" height="1.5" fill="#1c1813"></rect>
  </g>
</svg>
