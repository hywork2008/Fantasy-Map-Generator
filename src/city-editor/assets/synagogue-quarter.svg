<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-22 -22 44 44" width="500" height="500">
  <style>
    .ce-synagogue-shadow { fill: rgba(18, 22, 25, 0.35); }
    .ce-synagogue-wall { fill: #c7beaf; stroke: #3a3427; stroke-width: 0.65px; stroke-linejoin: round; }
    .ce-synagogue-court { fill: #ded6c5; stroke: #3a3427; stroke-width: 0.4px; }
    .ce-synagogue-roof { fill: #a8583b; stroke: #421e12; stroke-width: 0.45px; }
    .ce-synagogue-house-roof { fill: #ba6341; stroke: #421e12; stroke-width: 0.35px; }
    .ce-synagogue-house-alt { fill: #8c4b32; stroke: #421e12; stroke-width: 0.35px; }
    .ce-synagogue-star { stroke: #ffd54f; stroke-width: 0.35px; fill: none; }
    .ce-synagogue-mikveh-water { fill: #3f799e; stroke: #1f3d52; stroke-width: 0.3px; }
  </style>
  <g class="ce-landmark ce-landmark--synagogue-quarter">
    <!-- 影 -->
    <g class="ce-synagogue-shadow" transform="translate(1.4 1.6)">
      <polygon points="-16,-17 17,-17 17,16 -16,16"></polygon>
      <rect x="-7" y="-7" width="14" height="11" rx="0.5"></rect>
    </g>
    <!-- ユダヤ人街隔離外壁（Ghetto Wall） -->
    <g class="ce-synagogue-wall">
      <polygon points="-16,-17 17,-17 17,16 -16,16"></polygon>
    </g>
    <!-- 街区内石畳・路地網 -->
    <g class="ce-synagogue-court">
      <polygon points="-15,-16 16,-16 16,15 -15,15"></polygon>
      <!-- クランクした狭い路地 -->
      <line x1="-15" y1="5" x2="16" y2="5" stroke="#beb49f" stroke-width="2"></line>
      <line x1="0" y1="5" x2="0" y2="15" stroke="#beb49f" stroke-width="2"></line>
      <line x1="-5" y1="-16" x2="-5" y2="5" stroke="#beb49f" stroke-width="1.8"></line>
    </g>
    <!-- 高密度住宅群（密集する切妻屋根列） -->
    <g>
      <!-- 北側住宅群 -->
      <rect x="-14.5" y="-15.5" width="4.5" height="7.5" class="ce-synagogue-house-roof"></rect>
      <line x1="-12.2" y1="-15.5" x2="-12.2" y2="-8" stroke="#f0b69e" stroke-width="0.3"></line>
      <rect x="7" y="-15.5" width="4" height="8" class="ce-synagogue-house-alt"></rect>
      <line x1="9" y1="-15.5" x2="9" y2="-7.5" stroke="#f0b69e" stroke-width="0.3"></line>
      <rect x="11.5" y="-15.5" width="4" height="8" class="ce-synagogue-house-roof"></rect>
      <line x1="13.5" y1="-15.5" x2="13.5" y2="-7.5" stroke="#f0b69e" stroke-width="0.3"></line>
      <!-- 東側住宅群 -->
      <rect x="9.5" y="-6.5" width="6" height="4.5" class="ce-synagogue-house-roof"></rect>
      <rect x="9.5" y="-1.5" width="6" height="5.5" class="ce-synagogue-house-alt"></rect>
      <!-- 南側住宅群（門の左右） -->
      <rect x="-14.5" y="7" width="5.5" height="7.5" class="ce-synagogue-house-roof"></rect>
      <rect x="-8.5" y="7" width="6" height="7.5" class="ce-synagogue-house-alt"></rect>
      <rect x="2.5" y="7" width="6" height="7.5" class="ce-synagogue-house-roof"></rect>
      <rect x="9" y="7" width="6.5" height="7.5" class="ce-synagogue-house-alt"></rect>
      <!-- 西側住宅群 -->
      <rect x="-14.5" y="-7.5" width="7" height="5" class="ce-synagogue-house-alt"></rect>
      <rect x="-14.5" y="-2" width="7" height="5.5" class="ce-synagogue-house-roof"></rect>
    </g>
    <!-- 沐浴場（ミクヴェ - 街区北西部）天窓と水槽 -->
    <g transform="translate(-1, -12)">
      <rect x="-3" y="-3" width="6" height="5" rx="0.3" fill="#aba08a" stroke="#3a3427" stroke-width="0.35"></rect>
      <rect x="-1.8" y="-1.8" width="3.6" height="2.6" class="ce-synagogue-mikveh-water"></rect>
      <circle cx="0" cy="-0.5" r="0.6" fill="#ffffff" opacity="0.6"></circle>
    </g>
    <!-- 中核施設：シナゴーグ（Old-New Synagogue / Altneuschul 型）寄棟高大屋根 -->
    <g transform="translate(1, -1)">
      <!-- 基壇と控え壁（バットレス） -->
      <rect x="-7.5" y="-6.5" width="15" height="11" rx="0.4" fill="#a89d89" stroke="#3a3427" stroke-width="0.5"></rect>
      <!-- 寄棟大屋根（四方に傾斜する重厚なスレート・瓦屋根） -->
      <rect x="-6.8" y="-5.8" width="13.6" height="9.6" rx="0.3" class="ce-synagogue-roof"></rect>
      <!-- 屋根の四隅稜線 -->
      <line x1="-6.8" y1="-5.8" x2="-3.5" y2="-1" stroke="#3d1b10" stroke-width="0.45"></line>
      <line x1="6.8" y1="-5.8" x2="3.5" y2="-1" stroke="#3d1b10" stroke-width="0.45"></line>
      <line x1="-6.8" y1="3.8" x2="-3.5" y2="-1" stroke="#3d1b10" stroke-width="0.45"></line>
      <line x1="6.8" y1="3.8" x2="3.5" y2="-1" stroke="#3d1b10" stroke-width="0.45"></line>
      <!-- 大棟線 -->
      <line x1="-3.5" y1="-1" x2="3.5" y2="-1" stroke="#ffd54f" stroke-width="0.6" stroke-linecap="round"></line>
      <!-- 頂部のダビデの星（Magen David / 六芒星） -->
      <g transform="translate(0, -1)">
        <polygon points="0,-1.4 1.2,0.7 -1.2,0.7" class="ce-synagogue-star"></polygon>
        <polygon points="0,1.4 1.2,-0.7 -1.2,-0.7" class="ce-synagogue-star"></polygon>
        <circle cx="0" cy="0" r="0.25" fill="#ffd54f"></circle>
      </g>
      <!-- 門前ポーチ（西側） -->
      <rect x="-7.8" y="-2" width="1.4" height="2" fill="#2d2217"></rect>
    </g>
    <!-- 隔離区画の専用門（Ghetto Gate - 南壁中央・夜間施錠される重厚な門扉） -->
    <g transform="translate(0, 15.5)">
      <rect x="-2.5" y="-1.5" width="5" height="3" fill="#695641" stroke="#3a3427" stroke-width="0.5"></rect>
      <rect x="-1.2" y="-1" width="2.4" height="2" fill="#1b1712"></rect>
      <!-- 門の両脇の衛所小室 -->
      <circle cx="-2.2" cy="0" r="0.4" fill="#dfa83d"></circle>
      <circle cx="2.2" cy="0" r="0.4" fill="#dfa83d"></circle>
    </g>
  </g>
</svg>
