<text x="485" y="585" class="label">1  主門・門楼</text>
<text x="485" y="607" class="note">市街の支線から庭へ。壁に実際の開口を設ける。</text>
<text x="485" y="633" class="label">2  城庭・主要動線</text>
<text x="485" y="655" class="note">庭を先に確保し、主塔と居館への通路を残す。</text>
<text x="485" y="681" class="label">3  主塔</text>
<text x="485" y="703" class="note">明確な矩形の平面。門の真正面を塞がない。</text>
<text x="485" y="729" class="label">4  広間・居館</text>
<text x="485" y="751" class="note">囲壁の内側に沿う棟。居住と行政の中心。</text>
<text x="485" y="777" class="label">5  付属棟</text>
<text x="485" y="799" class="note">厨房・厩・倉庫などを少数配置する。</text>
<text x="28" y="886" class="subtitle">共有壁は一つの実体を参照し、中央城の囲壁を都市外周として扱わない。数値と比率は生成用の設計値です。</text>
</svg>
