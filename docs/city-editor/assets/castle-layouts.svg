<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="910" viewBox="0 0 1200 910" role="img" aria-labelledby="title description">
<title id="title">城と都市壁の配置、および城内の平面構成</title>
<desc id="description">外周一体型、外周独立型、中央独立型の三つの模式図と、主門、城庭、主塔、居館、付属棟を持つ城の平面図。史例の復元図ではなく City Editor の設計案。</desc>
<style>text{font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;fill:#283139}.title{font-size:25px;font-weight:700}.subtitle{font-size:13px;fill:#5c6670}.label{font-size:15px;font-weight:600}.note{font-size:13px;fill:#4c5861}.small{font-size:12px}.wall{fill:none;stroke-linejoin:round;stroke-linecap:round}.house{fill:#d9d8d1;stroke:#b3b6b0;stroke-width:1}.building{fill:#aca59a;stroke:#484745;stroke-width:2}.callout{fill:none;stroke:#677780;stroke-width:1.3}</style>
<rect x="0" y="0" width="1200" height="910" fill="#f6f5ef"/>
<text x="28" y="42" class="title">城は「都市の壁」と「城自身の壁」を持つ</text>
<text x="28" y="68" class="subtitle">City Editor の設計模式図 — 歴史的建築の復元図ではありません。上段は縮尺を定めない概念図です。</text>
